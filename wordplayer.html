<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Word Player</title>
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="/shared/css/wordplayer.css" />
  </head>
  <body class="game-body">
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a href="./index.html" class="back-button" aria-label="Retour"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
      </div>
      <div class="nav-center">
        <img id="game-banner" src="" alt="Logo" class="nav-banner" />
        <h1 id="nav-title" class="nav-title"></h1>
      </div>
      <div class="nav-side nav-right">
        <div id="score-display" class="score-display" style="display: none">
          0
        </div>
        <button
          id="options-button"
          class="options-button"
          type="button"
          aria-label="Options"
          aria-expanded="false"
          aria-controls="options-panel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div id="options-panel" class="options-panel" hidden>
      <div class="options-panel-backdrop" data-options-close></div>
      <div
        class="options-panel-sheet"
        role="dialog"
        aria-modal="true"
        aria-label="Options"
      >
        <div class="options-panel-header">
          <span class="options-panel-title">Options</span>
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            aria-label="Fermer"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section">
            <p class="options-panel-section-title">Langue</p>
            <div id="lang-selector" class="lang-selector"></div>
          </div>
          <div
            id="rules-section"
            class="options-panel-section"
            style="display: none"
          >
            <p class="options-panel-section-title">Règles</p>
            <div id="rules-content" class="rules-modal-content"></div>
          </div>
        </div>
      </div>
    </div>

    <main class="game-container">
      <section class="game-interface">
        <div id="timer-display" class="timer-display"></div>
        <div id="word-display" class="word-card"></div>
        <div id="controls-container" class="controls"></div>
      </section>
    </main>

    <script src="/shared/js/game-header.js"></script>
    <script type="module" src="./wordplayer.js"></script>
  </body>
</html>
