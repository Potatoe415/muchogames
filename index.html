<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaeb" />
    <title>Muchogames</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="./hub.css" />
  </head>
  <body>
    <div class="hub-shell">
      <header class="hub-header">
        <picture>
          <source
            media="(max-width: 599px)"
            srcset="./assets/banner-games-hub-mobile.jpg"
          />
          <img
            src="./assets/banner-games-hub.jpg"
            alt="Muchogames"
            class="main-banner"
          />
        </picture>
        <h1 class="banner-title" data-id="hub-banner-title">Game on!</h1>
        <button
          class="hub-share-button"
          id="hub-share-button"
          aria-label="Partager Muchogames"
          title="Partager Muchogames"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
            <polyline points="16 6 12 2 8 6" />
            <line x1="12" y1="2" x2="12" y2="15" />
          </svg>
        </button>
      </header>

      <!-- Outside .hub-header on purpose: that header has overflow:hidden
           to contain the banner image, which was clipping the auth popover
           whenever it grew taller than the remaining header height. -->
      <div class="auth-widget" id="auth-widget"></div>
      <div class="lang-switcher" id="lang-switcher"></div>

      <main class="hub-main">
        <nav class="category-tabs" id="category-tabs"></nav>

        <div id="games-grid" class="games-grid">
          <p>Chargement des jeux...</p>
        </div>
      </main>
    </div>

    <script src="/shared/js/player-profile.js"></script>
    <script src="/shared/js/profile-results.js"></script>
    <script type="module" src="./hub.js"></script>
  </body>
</html>
