<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaeb" />
    <title>Muchogames</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="./hub.css" />
    <link rel="stylesheet" href="./hub-shelf.css" />
    <link rel="stylesheet" href="./hub-home.css" />
    <link rel="stylesheet" href="./hub-library.css" />
    <link rel="stylesheet" href="./hub-catalog.css" />
    <link rel="stylesheet" href="./hub-coins.css" />
  </head>
  <body>
    <div class="hub-shell">
      <header class="hub-header">
        <picture>
          <source
            media="(max-width: 599px)"
            srcset="./assets/banner-games-hub-mobile.jpg"
          />
          <img
            src="./assets/banner-games-hub.jpg"
            alt="Muchogames"
            class="main-banner"
          />
        </picture>
        <h1 class="banner-title" data-id="hub-banner-title">Game on!</h1>
        <button
          class="hub-share-button"
          id="hub-share-button"
          aria-label="Partager Muchogames"
          title="Partager Muchogames"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <line x1="8.6" y1="13.5" x2="15.4" y2="17.5" />
            <line x1="15.4" y1="6.5" x2="8.6" y2="10.5" />
          </svg>
        </button>
      </header>

      <!-- Outside .hub-header on purpose: that header has overflow:hidden
           to contain the banner image, which was clipping the auth popover
           whenever it grew taller than the remaining header height. -->
      <div class="auth-widget" id="auth-widget"></div>
      <div class="lang-switcher" id="lang-switcher"></div>
      <button
        type="button"
        class="hub-coins"
        id="hub-coins"
        data-id="hub-coins"
        aria-expanded="false"
      ></button>

      <main class="hub-main">
        <div
          class="hub-announcement"
          id="hub-announcement"
          data-id="hub-announcement"
          role="status"
          hidden
        ></div>
        <div class="hub-nav" id="hub-nav" data-id="hub-nav">
          <div class="hub-nav__bar">
            <nav class="hub-views" data-id="hub-views">
              <button
                type="button"
                class="hub-view"
                data-view="home"
                data-id="hub-view-home"
              >
                Accueil
              </button>
              <button
                type="button"
                class="hub-view"
                data-view="library"
                data-id="hub-view-library"
              >
                Tous les jeux
              </button>
            </nav>
            <div class="hub-search" data-id="hub-search">
              <button
                type="button"
                class="hub-search__toggle"
                id="hub-search-toggle"
                data-id="hub-search-toggle"
                aria-expanded="false"
                aria-controls="hub-search-input"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  aria-hidden="true"
                >
                  <circle
                    cx="11"
                    cy="11"
                    r="7"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                  />
                  <path
                    d="M16.5 16.5 21 21"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
              <svg
                class="hub-search__icon"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <circle
                  cx="11"
                  cy="11"
                  r="7"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                />
                <path
                  d="M16.5 16.5 21 21"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                />
              </svg>
              <input
                type="search"
                class="hub-search__input"
                id="hub-search-input"
                data-id="hub-search-input"
                autocomplete="off"
                enterkeyhint="search"
                placeholder="Rechercher un jeu"
              />
              <button
                type="button"
                class="hub-search__close"
                id="hub-search-close"
                data-id="hub-search-close"
              >
                ×
              </button>
            </div>
            <div class="hub-sort" id="hub-sort" data-id="hub-sort" hidden></div>
          </div>
          <div
            class="hub-pills"
            id="hub-pills"
            data-id="hub-pills"
            hidden
          ></div>
        </div>

        <div class="hub-home" id="hub-home" data-id="hub-home">
          <p>Chargement des jeux...</p>
        </div>
        <div
          class="hub-library"
          id="hub-library"
          data-id="hub-library"
          hidden
        ></div>
      </main>
    </div>

    <script src="/shared/js/player-profile.js"></script>
    <script src="/shared/js/profile-results.js"></script>
    <script src="/shared/js/feedback.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script type="module" src="./hub.js"></script>
  </body>
</html>
