<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil — Muchogames</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Quicksand:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="/profile/profile.css" />
    <link rel="stylesheet" href="/profile/profile-crop.css" />
  </head>
  <body>
    <header class="game-nav" data-id="profile-header">
      <div class="nav-side nav-left">
        <a
          href="/"
          class="back-button"
          data-id="profile-back-button"
          aria-label="Retour"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" />
          </svg>
        </a>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-id="profile-title">Profil</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          id="profile-options-button"
          data-id="profile-options-button"
          type="button"
          aria-label="Paramètres"
          aria-expanded="false"
          aria-controls="profile-options-panel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      class="options-panel"
      id="profile-options-panel"
      data-id="profile-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div
        class="options-panel-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="profile-options-title"
      >
        <div class="options-panel-header">
          <span
            class="options-panel-title"
            id="profile-options-title"
            data-id="profile-options-title"
            >Options</span
          >
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="profile-options-close"
            aria-label="Fermer"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section">
            <p
              class="options-panel-section-title"
              data-id="profile-lang-section-title"
            >
              Langue
            </p>
            <div
              id="profile-lang-selector"
              class="lang-selector"
              data-id="profile-lang-selector"
              role="group"
              aria-label="Langue"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <main class="profile-shell" data-id="profile-page">
      <div class="profile-avatar-block" data-id="profile-avatar-block">
        <label
          class="profile-avatar-button"
          for="profile-avatar-input"
          id="profile-avatar-button"
          data-id="profile-avatar-button"
        >
          <img
            class="profile-avatar-preview"
            id="profile-avatar-preview"
            data-id="profile-avatar-preview"
            alt=""
            hidden
          />
          <span
            class="profile-avatar-placeholder"
            id="profile-avatar-placeholder"
            data-id="profile-avatar-placeholder"
            aria-hidden="true"
          >
            👤
          </span>
        </label>
        <input
          class="profile-avatar-input"
          id="profile-avatar-input"
          data-id="profile-avatar-input"
          type="file"
          accept="image/*"
          hidden
        />
        <button
          class="profile-avatar-remove-button"
          id="profile-avatar-remove-button"
          data-id="profile-avatar-remove-button"
          type="button"
          hidden
        >
          Retirer
        </button>
        <p
          class="profile-avatar-error"
          id="profile-avatar-error"
          data-id="profile-avatar-error"
          hidden
        ></p>
      </div>

      <form
        class="profile-name-form"
        id="profile-name-form"
        data-id="profile-name-form"
      >
        <label
          class="profile-label"
          for="profile-name-input"
          data-id="profile-name-label"
          >Nom</label
        >
        <input
          class="profile-name-input"
          id="profile-name-input"
          data-id="profile-name-input"
          type="text"
          placeholder="Ton nom"
          autocomplete="name"
          maxlength="40"
        />
        <button
          class="profile-save-button"
          type="submit"
          data-id="profile-name-save-button"
        >
          Enregistrer
        </button>
        <p
          class="profile-saved-notice"
          id="profile-name-saved-notice"
          data-id="profile-name-saved-notice"
          hidden
        >
          Enregistré ✓
        </p>
      </form>

      <section class="profile-stats" data-id="profile-stats">
        <p
          class="profile-launches-total"
          id="profile-launches-total"
          data-id="profile-launches-total"
        ></p>
        <p
          class="profile-game-results"
          id="profile-game-results"
          data-id="profile-game-results"
        ></p>
        <h2 class="profile-favorites-title" data-id="profile-favorites-title">
          Jeux préférés
        </h2>
        <ol
          class="profile-favorites-list"
          id="profile-favorites-list"
          data-id="profile-favorites-list"
          hidden
        ></ol>
        <p
          class="profile-favorites-empty"
          id="profile-favorites-empty"
          data-id="profile-favorites-empty"
          hidden
        ></p>
      </section>
    </main>

    <div
      class="avatar-crop"
      id="profile-avatar-crop"
      data-id="profile-avatar-crop"
      hidden
    >
      <div
        class="avatar-crop-backdrop"
        data-id="profile-avatar-crop-backdrop"
      ></div>
      <div
        class="avatar-crop-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="profile-avatar-crop-title"
      >
        <h2
          class="avatar-crop-title"
          id="profile-avatar-crop-title"
          data-id="profile-avatar-crop-title"
        >
          Recadrer
        </h2>
        <div
          class="avatar-crop-stage"
          id="profile-avatar-crop-stage"
          data-id="profile-avatar-crop-stage"
        >
          <img
            class="avatar-crop-image"
            id="profile-avatar-crop-image"
            data-id="profile-avatar-crop-image"
            alt=""
            draggable="false"
          />
        </div>
        <label class="avatar-crop-zoom-label" for="profile-avatar-crop-zoom">
          <span data-id="profile-avatar-crop-zoom-label">Zoom</span>
          <input
            class="avatar-crop-zoom"
            id="profile-avatar-crop-zoom"
            data-id="profile-avatar-crop-zoom"
            type="range"
            min="1"
            max="3"
            step="0.01"
            value="1"
          />
        </label>
        <div class="avatar-crop-actions">
          <button
            class="avatar-crop-cancel"
            id="profile-avatar-crop-cancel"
            data-id="profile-avatar-crop-cancel"
            type="button"
          >
            Annuler
          </button>
          <button
            class="avatar-crop-apply"
            id="profile-avatar-crop-apply"
            data-id="profile-avatar-crop-apply"
            type="button"
          >
            Valider
          </button>
        </div>
      </div>
    </div>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/player-profile.js"></script>
    <script src="/shared/js/profile-results.js"></script>
    <script type="module" src="/profile/profile.js"></script>
  </body>
</html>
