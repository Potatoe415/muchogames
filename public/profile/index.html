<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil — Muchogames</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Quicksand:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="/profile/profile.css" />
    <link rel="stylesheet" href="/profile/profile-mascot.css" />
    <link rel="stylesheet" href="/profile/profile-account.css" />
    <link rel="stylesheet" href="/profile/profile-tabs.css" />
  </head>
  <body>
    <header class="game-nav" data-id="profile-header">
      <div class="nav-side nav-left">
        <a
          href="/"
          class="back-button"
          data-id="profile-back-button"
          aria-label="Retour"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" />
          </svg>
        </a>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-id="profile-title">Profil</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          id="profile-options-button"
          data-id="profile-options-button"
          type="button"
          aria-label="Paramètres"
          aria-expanded="false"
          aria-controls="profile-options-panel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      class="options-panel"
      id="profile-options-panel"
      data-id="profile-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div
        class="options-panel-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="profile-options-title"
      >
        <div class="options-panel-header">
          <span
            class="options-panel-title"
            id="profile-options-title"
            data-id="profile-options-title"
            >Options</span
          >
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="profile-options-close"
            aria-label="Fermer"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section">
            <p
              class="options-panel-section-title"
              data-id="profile-lang-section-title"
            >
              Langue
            </p>
            <div
              id="profile-lang-selector"
              class="lang-selector"
              data-id="profile-lang-selector"
              role="group"
              aria-label="Langue"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <main class="profile-shell" data-id="profile-page">
      <div class="profile-tabs" data-id="profile-tabs" role="tablist">
        <button
          class="profile-tab is-active"
          id="profile-tab-info"
          data-id="profile-tab-info"
          data-tab="info"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="profile-tab-panel-info"
        >
          Infos
        </button>
        <button
          class="profile-tab"
          id="profile-tab-stats"
          data-id="profile-tab-stats"
          data-tab="stats"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="profile-tab-panel-stats"
        >
          Statistiques
        </button>
      </div>

      <div
        class="profile-tab-panel"
        id="profile-tab-panel-info"
        data-id="profile-tab-panel-info"
        role="tabpanel"
        aria-labelledby="profile-tab-info"
      >
        <div class="profile-avatar-block" data-id="profile-avatar-block">
          <button
            class="profile-avatar-button"
            id="profile-avatar-button"
            data-id="profile-avatar-button"
            type="button"
            aria-haspopup="dialog"
          >
            <img
              class="profile-avatar-preview"
              id="profile-avatar-preview"
              data-id="profile-avatar-preview"
              alt=""
            />
          </button>
          <button
            class="profile-mascot-change-button"
            id="profile-mascot-change-button"
            data-id="profile-mascot-change-button"
            type="button"
            aria-haspopup="dialog"
          >
            Changer de mascotte
          </button>
        </div>

        <form
          class="profile-name-form"
          id="profile-name-form"
          data-id="profile-name-form"
        >
          <label
            class="profile-label"
            for="profile-name-input"
            data-id="profile-name-label"
            >Nom</label
          >
          <input
            class="profile-name-input"
            id="profile-name-input"
            data-id="profile-name-input"
            type="text"
            placeholder="Ton nom"
            autocomplete="name"
            maxlength="40"
          />
          <button
            class="profile-save-button"
            type="submit"
            data-id="profile-name-save-button"
          >
            Enregistrer
          </button>
          <p
            class="profile-saved-notice"
            id="profile-name-saved-notice"
            data-id="profile-name-saved-notice"
            hidden
          >
            Enregistré ✓
          </p>
        </form>

        <section
          class="profile-account"
          data-id="profile-account-section"
          hidden
        >
          <h2
            class="profile-favorites-title"
            data-id="profile-account-title"
          ></h2>
          <button
            class="profile-account-button"
            type="button"
            data-id="profile-export-button"
          ></button>
          <button
            class="profile-account-button profile-account-button--danger"
            type="button"
            data-id="profile-delete-button"
          ></button>
          <div
            class="profile-account-confirm"
            data-id="profile-delete-confirm"
            hidden
          >
            <p
              class="profile-account-warning"
              data-id="profile-delete-warning"
            ></p>
            <button
              class="profile-account-button profile-account-button--danger-solid"
              type="button"
              data-id="profile-delete-confirm-button"
            ></button>
            <button
              class="profile-account-button"
              type="button"
              data-id="profile-delete-cancel-button"
            ></button>
          </div>
          <p
            class="profile-account-error"
            data-id="profile-account-error"
            role="alert"
            hidden
          ></p>
        </section>
      </div>

      <div
        class="profile-tab-panel"
        id="profile-tab-panel-stats"
        data-id="profile-tab-panel-stats"
        role="tabpanel"
        aria-labelledby="profile-tab-stats"
        hidden
      >
        <section class="profile-stats" data-id="profile-stats">
          <p
            class="profile-launches-total"
            id="profile-matches-total"
            data-id="profile-matches-total"
          ></p>
          <p
            class="profile-game-results"
            id="profile-game-results"
            data-id="profile-game-results"
          ></p>
          <h2 class="profile-favorites-title" data-id="profile-favorites-title">
            Jeux préférés
          </h2>
          <ol
            class="profile-favorites-list"
            id="profile-favorites-list"
            data-id="profile-favorites-list"
            hidden
          ></ol>
          <p
            class="profile-favorites-empty"
            id="profile-favorites-empty"
            data-id="profile-favorites-empty"
            hidden
          ></p>
        </section>

        <section class="profile-games" data-id="profile-games-section" hidden>
          <h2
            class="profile-favorites-title"
            data-id="profile-games-title"
          ></h2>
          <ul class="profile-games-list" data-id="profile-games-list"></ul>
        </section>
      </div>
    </main>

    <div
      class="mascot-picker"
      id="profile-mascot-picker"
      data-id="profile-mascot-picker"
      hidden
    >
      <div
        class="mascot-picker-backdrop"
        data-id="profile-mascot-picker-backdrop"
      ></div>
      <div
        class="mascot-picker-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="profile-mascot-picker-title"
      >
        <h2
          class="mascot-picker-title"
          id="profile-mascot-picker-title"
          data-id="profile-mascot-picker-title"
        >
          Choisis ta mascotte
        </h2>
        <div
          class="mascot-picker-grid"
          id="profile-mascot-picker-grid"
          data-id="profile-mascot-picker-grid"
        ></div>
        <button
          class="mascot-picker-close"
          id="profile-mascot-picker-close"
          data-id="profile-mascot-picker-close"
          type="button"
        >
          Fermer
        </button>
      </div>
    </div>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/player-profile.js"></script>
    <script src="/shared/js/profile-results.js"></script>
    <script type="module" src="/profile/profile.js"></script>
  </body>
</html>
