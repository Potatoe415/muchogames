<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — Mucho Games</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <link rel="stylesheet" href="/admin/admin-feedback.css" />
  </head>
  <body>
    <main class="admin-shell">
      <h1 class="admin-title" data-id="admin-page-title">Admin</h1>

      <section
        class="admin-card admin-login"
        id="admin-login"
        data-id="admin-login-section"
      >
        <p class="admin-login-intro" data-id="admin-login-intro">
          Sign in with the Google account allowed to manage Mucho Games.
        </p>
        <div
          class="admin-google-button"
          id="admin-google-button"
          data-id="admin-google-signin-button"
        ></div>
        <p
          class="admin-error"
          id="admin-error"
          data-id="admin-error-banner"
          hidden
        ></p>
      </section>

      <section
        class="admin-card"
        id="admin-dashboard"
        data-id="admin-dashboard-section"
        hidden
      >
        <header class="admin-dashboard-header">
          <div>
            <p class="admin-metric-label">Game launches</p>
            <p
              class="admin-metric-value"
              id="admin-total-launches"
              data-id="admin-total-launches"
            >
              —
            </p>
            <p
              class="admin-metric-caption"
              id="admin-range-caption"
              data-id="admin-range-caption"
            ></p>
          </div>
          <div class="admin-actions">
            <button
              class="admin-button admin-button--ghost"
              type="button"
              id="admin-refresh-button"
              data-id="admin-refresh-button"
            >
              Refresh
            </button>
            <button
              class="admin-button admin-button--ghost"
              type="button"
              id="admin-logout-button"
              data-id="admin-logout-button"
            >
              Log out
            </button>
          </div>
        </header>

        <div
          class="admin-range"
          id="admin-range-switch"
          data-id="admin-range-switch"
          role="group"
          aria-label="Displayed period"
        >
          <button
            class="admin-range-option"
            type="button"
            data-range="7d"
            data-id="admin-range-7d"
          >
            7 days
          </button>
          <button
            class="admin-range-option"
            type="button"
            data-range="30d"
            data-id="admin-range-30d"
          >
            30 days
          </button>
          <button
            class="admin-range-option"
            type="button"
            data-range="6m"
            data-id="admin-range-6m"
          >
            6 months
          </button>
        </div>

        <div class="admin-trend-header">
          <h2 class="admin-section-title">Daily trend</h2>
          <select
            class="admin-trend-game-select"
            id="admin-trend-game-select"
            data-id="admin-trend-game-select"
            aria-label="Filter trend by game"
          >
            <option value="">All Games</option>
          </select>
        </div>
        <div
          class="admin-trend"
          id="admin-trend"
          data-id="admin-trend-chart"
        ></div>

        <h2 class="admin-section-title">Game ranking</h2>
        <ol
          class="admin-ranking"
          id="admin-ranking"
          data-id="admin-ranking-list"
        ></ol>
        <p
          class="admin-empty"
          id="admin-empty"
          data-id="admin-empty-state"
          hidden
        >
          No launches recorded yet.
        </p>
      </section>

      <section
        class="admin-card admin-feedback"
        id="admin-feedback"
        data-id="admin-feedback-section"
        hidden
      >
        <h2 class="admin-section-title">Feedback</h2>
        <div
          class="admin-range"
          id="admin-feedback-status-switch"
          data-id="admin-feedback-status-switch"
          role="group"
          aria-label="Feedback status"
        >
          <button
            class="admin-range-option"
            type="button"
            data-status="new"
            data-id="admin-feedback-status-new"
          >
            New
          </button>
          <button
            class="admin-range-option"
            type="button"
            data-status="in_progress"
            data-id="admin-feedback-status-in-progress"
          >
            In progress
          </button>
          <button
            class="admin-range-option"
            type="button"
            data-status="resolved"
            data-id="admin-feedback-status-resolved"
          >
            Resolved
          </button>
        </div>
        <ol
          class="admin-feedback-list"
          id="admin-feedback-list"
          data-id="admin-feedback-list"
        ></ol>
        <p
          class="admin-empty"
          id="admin-feedback-empty"
          data-id="admin-feedback-empty-state"
          hidden
        >
          No reports here.
        </p>
      </section>

      <a class="admin-back" href="/" data-id="admin-back-to-hub"
        >← Back to hub</a
      >
    </main>

    <script type="module" src="/admin/admin.js"></script>
  </body>
</html>
