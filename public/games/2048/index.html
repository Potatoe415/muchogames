<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e8eee8" />
    <title>2048</title>
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="start.css" />
    <link rel="stylesheet" href="stage.css" />
    <link rel="stylesheet" href="tiles.css" />
    <script src="/shared/js/tv-remote.js"></script>
  </head>
  <body data-match-saved>
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a
          class="back-button"
          href="/"
          data-id="game-back-button"
          data-tv-back
          aria-label="Retour"
          data-i18n-aria="back"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-i18n="title">2048</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          type="button"
          data-id="game-options-button"
          aria-label="Options"
          data-i18n-aria="options"
          aria-expanded="false"
          aria-controls="optionsPanel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="optionsPanel"
      class="options-panel"
      data-id="game-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div class="options-panel-sheet" role="dialog" aria-modal="true">
        <div class="options-panel-header">
          <span class="options-panel-title" data-i18n="options">Options</span>
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="2048-options-close"
            aria-label="Fermer"
            data-i18n-aria="close"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section" data-id="game-options-language">
            <p class="options-panel-section-title" data-i18n="language">
              Langue
            </p>
            <div class="t2-chips">
              <button
                type="button"
                class="t2-chip"
                data-lang="fr"
                data-id="2048-lang-fr"
              >
                FR
              </button>
              <button
                type="button"
                class="t2-chip"
                data-lang="en"
                data-id="2048-lang-en"
              >
                EN
              </button>
              <button
                type="button"
                class="t2-chip"
                data-lang="es"
                data-id="2048-lang-es"
              >
                ES
              </button>
            </div>
          </div>
          <div class="options-panel-section" data-id="2048-options-sound">
            <p class="options-panel-section-title" data-i18n="sound">Son</p>
            <button
              type="button"
              class="t2-chip"
              data-id="2048-sound-toggle"
              aria-pressed="true"
            ></button>
          </div>
          <details class="options-panel-section" data-id="game-options-rules">
            <summary class="options-panel-section-title" data-i18n="rules">
              Règles
            </summary>
            <div class="rules-modal-content" data-id="2048-rules-content"></div>
          </details>
        </div>
      </div>
    </div>

    <main class="t2-app" data-id="2048-app">
      <section class="t2-start" data-id="2048-start-screen" data-tv-screen>
        <div class="t2-card">
          <p class="t2-logo" aria-hidden="true">
            <span data-value="2">2</span><span data-value="8">0</span
            ><span data-value="64">4</span><span data-value="512">8</span>
          </p>
          <h2 class="t2-visually-hidden" data-i18n="title">2048</h2>
          <p class="t2-pitch" data-i18n="pitch"></p>
          <button
            type="button"
            class="t2-button t2-resume"
            data-id="2048-resume-button"
            data-tv-focus
            hidden
          >
            <span data-i18n="resume">Reprendre</span>
            <span class="t2-resume-info" data-resume-info></span>
          </button>
          <button
            type="button"
            class="t2-button"
            data-id="2048-play-button"
            data-tv-focus
            data-i18n="play"
          >
            Nouvelle partie
          </button>
          <p class="t2-best" data-id="2048-start-best"></p>
        </div>
      </section>

      <section class="t2-stage" data-id="2048-stage" data-tv-screen hidden>
        <div class="t2-hud" data-id="2048-hud">
          <div class="t2-stat" data-id="2048-score">
            <span class="t2-stat-label" data-i18n="score">Score</span>
            <span class="t2-stat-value" data-id="2048-score-value">0</span>
          </div>
          <div class="t2-stat" data-id="2048-best">
            <span class="t2-stat-label" data-i18n="best">Record</span>
            <span class="t2-stat-value" data-id="2048-best-value">0</span>
          </div>
          <div class="t2-tools">
            <button type="button" class="t2-tool" data-id="2048-undo-button">
              <span aria-hidden="true">↶</span>
              <span class="t2-count" data-count></span>
            </button>
            <button
              type="button"
              class="t2-tool"
              data-id="2048-menu-button"
              data-tv-back
              aria-label="Menu"
              data-i18n-aria="menuButton"
            >
              <span aria-hidden="true">☰</span>
            </button>
          </div>
        </div>

        <div class="t2-board-area" data-id="2048-board-area">
          <div
            class="t2-board"
            data-id="2048-board"
            tabindex="0"
            data-tv-focus
            data-tv-keys="left right up down"
            role="group"
            data-i18n-aria="board"
          ></div>
        </div>
      </section>

      <div class="t2-overlay" data-id="2048-paused" data-tv-overlay hidden>
        <div class="t2-card" role="dialog" aria-modal="true">
          <h2 class="t2-overlay-title" data-i18n="paused">Pause</h2>
          <button
            type="button"
            class="t2-button"
            data-id="2048-continue-button"
            data-tv-focus
            data-tv-back
            data-i18n="continue"
          ></button>
          <button
            type="button"
            class="t2-button t2-button-soft"
            data-id="2048-paused-undo-button"
            data-i18n="undo"
          ></button>
          <button
            type="button"
            class="t2-button t2-button-soft"
            data-id="2048-paused-menu-button"
            data-match-quit
            data-i18n="menu"
          ></button>
        </div>
      </div>

      <div class="t2-overlay" data-id="2048-win" data-tv-overlay hidden>
        <div class="t2-card t2-win-card" role="dialog" aria-modal="true">
          <p class="t2-win-tile" aria-hidden="true">2048</p>
          <h2 class="t2-overlay-title" data-i18n="winTitle"></h2>
          <p data-i18n="winText"></p>
          <button
            type="button"
            class="t2-button"
            data-id="2048-keep-going-button"
            data-tv-focus
            data-tv-back
            data-i18n="keepGoing"
          ></button>
          <button
            type="button"
            class="t2-button t2-button-soft"
            data-id="2048-stop-button"
            data-i18n="stop"
          ></button>
        </div>
      </div>

      <div
        class="t2-overlay t2-overlay-late"
        data-id="2048-end"
        data-tv-overlay
        hidden
      >
        <div class="t2-card" role="dialog" aria-modal="true">
          <h2 class="t2-overlay-title" data-id="2048-end-title"></h2>
          <p class="t2-score-line" data-id="2048-end-score"></p>
          <p data-id="2048-end-top"></p>
          <p class="t2-best" data-id="2048-end-best"></p>
          <button
            type="button"
            class="t2-button"
            data-id="2048-replay-button"
            data-tv-focus
            data-i18n="replay"
          ></button>
          <button
            type="button"
            class="t2-button t2-button-soft"
            data-id="2048-end-menu-button"
            data-tv-back
            data-i18n="menu"
          ></button>
        </div>
      </div>
    </main>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
