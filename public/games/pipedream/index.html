<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e131d" />
    <title>Pipe Dream</title>
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-match-saved>
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a
          class="back-button"
          href="/"
          data-id="game-back-button"
          aria-label="Retour"
          data-i18n-aria="back"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-i18n="title">Pipe Dream</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          type="button"
          data-id="game-options-button"
          aria-label="Options"
          data-i18n-aria="options"
          aria-expanded="false"
          aria-controls="optionsPanel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="optionsPanel"
      class="options-panel"
      data-id="game-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div class="options-panel-sheet" role="dialog" aria-modal="true">
        <div class="options-panel-header">
          <span class="options-panel-title" data-i18n="options">Options</span>
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="pipedream-options-close"
            aria-label="Fermer"
            data-i18n-aria="close"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section" data-id="game-options-language">
            <p class="options-panel-section-title" data-i18n="language">
              Langue
            </p>
            <div class="pd-lang-switch">
              <button
                type="button"
                class="pd-chip"
                data-lang="fr"
                data-id="pipedream-lang-fr"
              >
                FR
              </button>
              <button
                type="button"
                class="pd-chip"
                data-lang="en"
                data-id="pipedream-lang-en"
              >
                EN
              </button>
              <button
                type="button"
                class="pd-chip"
                data-lang="es"
                data-id="pipedream-lang-es"
              >
                ES
              </button>
            </div>
          </div>
          <div class="options-panel-section" data-id="pipedream-options-sound">
            <p class="options-panel-section-title" data-i18n="sound">Son</p>
            <button
              type="button"
              class="pd-chip"
              data-id="pipedream-sound-toggle"
              aria-pressed="true"
            ></button>
          </div>
          <details class="options-panel-section" data-id="game-options-rules">
            <summary class="options-panel-section-title" data-i18n="rules">
              Règles
            </summary>
            <div
              class="rules-modal-content"
              data-id="pipedream-rules-content"
            ></div>
          </details>
        </div>
      </div>
    </div>

    <main class="pd-app" data-id="pipedream-app">
      <section class="pd-start" data-id="pipedream-start-screen">
        <div class="pd-card">
          <h2 class="pd-logo" data-i18n="title">Pipe Dream</h2>
          <p class="pd-pitch" data-i18n="pitch"></p>
          <p class="pd-best" data-id="pipedream-start-best"></p>
          <div class="pd-start-actions">
            <button
              type="button"
              class="pd-button"
              data-id="pipedream-continue-button"
              data-i18n="resume"
              hidden
            >
              Reprendre
            </button>
            <button
              type="button"
              class="pd-button"
              data-id="pipedream-start-button"
              data-i18n="play"
            >
              Jouer
            </button>
          </div>
        </div>
      </section>

      <section class="pd-stage" data-id="pipedream-stage" hidden>
        <div class="pd-board" data-id="pipedream-board">
          <canvas
            class="pd-canvas"
            data-id="pipedream-canvas"
            role="img"
            data-i18n-aria="canvas"
          ></canvas>
        </div>
        <div class="pd-hud" data-id="pipedream-hud">
          <div class="pd-stat" data-id="pipedream-hud-score">
            <span class="pd-stat-label" data-i18n="score">Score</span>
            <span class="pd-stat-value" data-hud="score">0</span>
          </div>
          <div class="pd-stat" data-id="pipedream-hud-level">
            <span class="pd-stat-label" data-i18n="level">Niveau</span>
            <span class="pd-stat-value" data-hud="level">1</span>
          </div>
          <div class="pd-stat" data-id="pipedream-hud-quota">
            <span class="pd-stat-label" data-i18n="quota">Quota</span>
            <span class="pd-stat-value" data-hud="quota">0</span>
          </div>
          <div class="pd-stat" data-id="pipedream-hud-countdown">
            <span class="pd-stat-label" data-i18n="countdown">Flooz</span>
            <span class="pd-stat-value" data-hud="countdown">—</span>
          </div>
          <button
            type="button"
            class="pd-fast"
            data-id="pipedream-fast-button"
            aria-pressed="false"
          >
            <span class="pd-fast-icon" aria-hidden="true">»</span>
            <span class="pd-fast-label" data-i18n="fast">Accélérer</span>
          </button>
        </div>

        <div class="pd-overlay" data-id="pipedream-level-cleared" hidden>
          <div class="pd-card">
            <h2 class="pd-overlay-title" data-id="pipedream-cleared-title"></h2>
            <p data-id="pipedream-cleared-stats"></p>
            <p data-id="pipedream-cleared-crosses"></p>
            <p class="pd-score-line" data-id="pipedream-cleared-score"></p>
            <button
              type="button"
              class="pd-button"
              data-id="pipedream-next-level-button"
              data-i18n="next"
            ></button>
          </div>
        </div>

        <div class="pd-overlay" data-id="pipedream-game-over" hidden>
          <div class="pd-card">
            <h2 class="pd-overlay-title" data-i18n="gameOver"></h2>
            <p data-id="pipedream-over-stats"></p>
            <p class="pd-score-line" data-id="pipedream-over-score"></p>
            <p class="pd-best" data-id="pipedream-over-best"></p>
            <button
              type="button"
              class="pd-button"
              data-id="pipedream-replay-button"
              data-i18n="replay"
            ></button>
          </div>
        </div>

        <div class="pd-overlay" data-id="pipedream-paused" hidden>
          <div class="pd-card">
            <h2 class="pd-overlay-title" data-i18n="paused"></h2>
            <button
              type="button"
              class="pd-button"
              data-id="pipedream-resume-button"
              data-i18n="resume"
            ></button>
          </div>
        </div>
      </section>
    </main>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
