<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16213a" />
    <title>Trivial Quizz</title>
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="stage.css" />
    <link rel="stylesheet" href="overlay.css" />
    <link rel="stylesheet" href="wheel.css" />
    <link rel="stylesheet" href="layout.css" />
    <script src="/shared/js/tv-remote.js"></script>
  </head>
  <body data-match-saved>
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a
          class="back-button"
          href="/"
          data-id="game-back-button"
          data-tv-back
          aria-label="Retour"
          data-i18n-aria="back"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
        <button
          type="button"
          class="back-button"
          data-id="trivialpursuit-quit-button"
          data-match-quit
          data-tv-back
          aria-label="Quitter la partie"
          data-i18n-aria="quit"
          hidden
        >
          <span aria-hidden="true">✕</span>
        </button>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-i18n="title">Trivial Quizz</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          type="button"
          data-id="game-options-button"
          aria-label="Options"
          data-i18n-aria="options"
          aria-expanded="false"
          aria-controls="optionsPanel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="optionsPanel"
      class="options-panel"
      data-id="game-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div class="options-panel-sheet" role="dialog" aria-modal="true">
        <div class="options-panel-header">
          <span class="options-panel-title" data-i18n="options">Options</span>
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="trivialpursuit-options-close"
            aria-label="Fermer"
            data-i18n-aria="close"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section" data-id="game-options-language">
            <p class="options-panel-section-title" data-i18n="language">
              Langue
            </p>
            <div class="tp-lang-switch">
              <button
                type="button"
                class="tp-chip"
                data-lang="fr"
                data-id="trivialpursuit-lang-fr"
              >
                FR
              </button>
              <button
                type="button"
                class="tp-chip"
                data-lang="en"
                data-id="trivialpursuit-lang-en"
              >
                EN
              </button>
              <button
                type="button"
                class="tp-chip"
                data-lang="es"
                data-id="trivialpursuit-lang-es"
              >
                ES
              </button>
            </div>
          </div>
          <div
            class="options-panel-section"
            data-id="trivialpursuit-options-play"
          >
            <p class="options-panel-section-title" data-i18n="game">Partie</p>
            <button
              type="button"
              class="tp-option-button"
              data-id="trivialpursuit-options-quit"
              data-match-quit
              data-i18n="quit"
            ></button>
          </div>
          <details class="options-panel-section" data-id="game-options-rules">
            <summary class="options-panel-section-title" data-i18n="rules">
              Règles
            </summary>
            <div
              class="rules-modal-content"
              data-id="trivialpursuit-rules-content"
            ></div>
          </details>
        </div>
      </div>
    </div>

    <main class="tp-app" data-id="trivialpursuit-app">
      <section
        class="tp-start"
        data-id="trivialpursuit-start-screen"
        data-tv-screen
      >
        <div class="tp-card">
          <h2 class="tp-logo" data-i18n="title">Trivial Quizz</h2>
          <p class="tp-pitch" data-i18n="pitch"></p>
          <button
            type="button"
            class="tp-resume"
            data-id="trivialpursuit-resume-button"
            data-tv-focus
            hidden
          >
            <span class="tp-resume-name" data-i18n="resume"></span>
            <span class="tp-resume-info" data-resume-info></span>
          </button>
          <p class="tp-label" data-i18n="modeLabel"></p>
          <div class="tp-modes" data-id="trivialpursuit-mode-list">
            <button
              type="button"
              class="tp-mode"
              data-mode="classic"
              data-id="trivialpursuit-mode-classic"
            >
              <span class="tp-mode-name" data-i18n="classic"></span>
              <span class="tp-mode-info" data-i18n="classicInfo"></span>
            </button>
            <button
              type="button"
              class="tp-mode"
              data-mode="quick"
              data-id="trivialpursuit-mode-quick"
            >
              <span class="tp-mode-name" data-i18n="quick"></span>
              <span class="tp-mode-info" data-i18n="quickInfo"></span>
            </button>
            <button
              type="button"
              class="tp-mode"
              data-mode="wheel"
              data-id="trivialpursuit-mode-wheel"
            >
              <span class="tp-mode-name" data-i18n="wheel"></span>
              <span class="tp-mode-info" data-i18n="wheelInfo"></span>
            </button>
          </div>
          <p class="tp-label" data-i18n="playersCount"></p>
          <div class="tp-counts" data-id="trivialpursuit-player-count">
            <button
              type="button"
              class="tp-chip"
              data-count="1"
              data-id="trivialpursuit-count-1"
            >
              1
            </button>
            <button
              type="button"
              class="tp-chip"
              data-count="2"
              data-id="trivialpursuit-count-2"
            >
              2
            </button>
            <button
              type="button"
              class="tp-chip"
              data-count="3"
              data-id="trivialpursuit-count-3"
            >
              3
            </button>
            <button
              type="button"
              class="tp-chip"
              data-count="4"
              data-id="trivialpursuit-count-4"
            >
              4
            </button>
            <button
              type="button"
              class="tp-chip"
              data-count="5"
              data-id="trivialpursuit-count-5"
            >
              5
            </button>
            <button
              type="button"
              class="tp-chip"
              data-count="6"
              data-id="trivialpursuit-count-6"
            >
              6
            </button>
          </div>
          <div class="tp-names" data-id="trivialpursuit-names"></div>
          <p
            class="tp-load"
            data-id="trivialpursuit-load-status"
            role="status"
          ></p>
          <button
            type="button"
            class="tp-button"
            data-id="trivialpursuit-start-button"
            data-tv-focus
            data-i18n="start"
            disabled
          ></button>
        </div>
      </section>

      <section
        class="tp-stage"
        data-id="trivialpursuit-stage"
        data-tv-screen
        hidden
      >
        <div class="tp-board-area" data-id="trivialpursuit-board-area">
          <div class="tp-board" data-id="trivialpursuit-board"></div>
        </div>
        <aside class="tp-panel" data-id="trivialpursuit-panel">
          <ol class="tp-players" data-id="trivialpursuit-players"></ol>
          <div class="tp-turn-box">
            <div class="tp-die" data-id="trivialpursuit-die" role="img"></div>
            <div class="tp-turn-text">
              <strong class="tp-turn" data-id="trivialpursuit-turn"></strong>
              <p
                class="tp-status"
                data-id="trivialpursuit-status"
                aria-live="polite"
              ></p>
            </div>
          </div>
          <button
            type="button"
            class="tp-button tp-roll"
            data-id="trivialpursuit-roll-button"
            data-tv-focus
            data-i18n="rollDie"
          ></button>
        </aside>

        <div
          class="tp-overlay"
          data-id="trivialpursuit-question"
          data-tv-overlay
          hidden
        >
          <div
            class="tp-qcard"
            data-id="trivialpursuit-question-card"
            role="dialog"
            aria-modal="true"
          >
            <button
              type="button"
              class="tp-qclose"
              data-id="trivialpursuit-question-close"
              data-tv-back
              aria-label="Fermer"
              data-i18n-aria="close"
            >
              ×
            </button>
            <p class="tp-qcat" data-id="trivialpursuit-question-category"></p>
            <p class="tp-qtag" data-id="trivialpursuit-question-tag"></p>
            <p class="tp-qtext" data-id="trivialpursuit-question-text"></p>
            <div class="tp-qanswer" data-id="trivialpursuit-answer">
              <p class="tp-qanswer-label" data-i18n="answer"></p>
              <p
                class="tp-qanswer-text"
                data-id="trivialpursuit-answer-text"
              ></p>
              <p class="tp-qinfo" data-id="trivialpursuit-answer-info"></p>
            </div>
            <div class="tp-qactions">
              <button
                type="button"
                class="tp-button"
                data-id="trivialpursuit-show-answer-button"
                data-tv-focus
                data-i18n="showAnswer"
              ></button>
              <button
                type="button"
                class="tp-button tp-right"
                data-id="trivialpursuit-right-button"
                data-tv-focus
                data-i18n="correct"
              ></button>
              <button
                type="button"
                class="tp-button tp-wrong"
                data-id="trivialpursuit-wrong-button"
                data-i18n="incorrect"
              ></button>
              <div
                class="tp-qlangs"
                data-id="trivialpursuit-question-languages"
              >
                <button
                  type="button"
                  class="tp-pot"
                  data-lang="fr"
                  data-id="trivialpursuit-question-lang-fr"
                >
                  FR
                </button>
                <button
                  type="button"
                  class="tp-pot"
                  data-lang="en"
                  data-id="trivialpursuit-question-lang-en"
                >
                  EN
                </button>
                <button
                  type="button"
                  class="tp-pot"
                  data-lang="es"
                  data-id="trivialpursuit-question-lang-es"
                >
                  ES
                </button>
                <button
                  type="button"
                  class="tp-link"
                  data-id="trivialpursuit-other-question-button"
                  data-i18n="otherQuestion"
                ></button>
              </div>
            </div>
          </div>
        </div>

        <div
          class="tp-overlay"
          data-id="trivialpursuit-choose"
          data-tv-overlay
          hidden
        >
          <div class="tp-qcard" role="dialog" aria-modal="true">
            <p class="tp-qtext" data-id="trivialpursuit-choose-title"></p>
            <div
              class="tp-cat-list"
              data-id="trivialpursuit-category-list"
            ></div>
          </div>
        </div>

        <div
          class="tp-overlay"
          data-id="trivialpursuit-end"
          data-tv-overlay
          hidden
        >
          <div class="tp-card">
            <h2 class="tp-end-title" data-id="trivialpursuit-end-title"></h2>
            <p data-id="trivialpursuit-end-line"></p>
            <ul class="tp-end-stats" data-id="trivialpursuit-end-stats"></ul>
            <div class="tp-actions">
              <button
                type="button"
                class="tp-button"
                data-id="trivialpursuit-replay-button"
                data-tv-focus
                data-i18n="replay"
              ></button>
              <button
                type="button"
                class="tp-button tp-button-ghost"
                data-id="trivialpursuit-new-game-button"
                data-tv-back
                data-i18n="newGame"
              ></button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/shared/js/player-profile.js"></script>
    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
