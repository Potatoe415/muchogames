<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1220" />
    <title>Tetris</title>
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="screens.css" />
    <link rel="stylesheet" href="stage.css" />
    <script src="/shared/js/tv-remote.js"></script>
  </head>
  <body data-match-saved>
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a
          class="back-button"
          href="/"
          data-id="game-back-button"
          data-tv-back
          aria-label="Retour"
          data-i18n-aria="back"
          ><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-i18n="title">Tetris</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          type="button"
          data-id="game-options-button"
          aria-label="Options"
          data-i18n-aria="options"
          aria-expanded="false"
          aria-controls="optionsPanel"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </div>
    </header>

    <div id="optionsPanel" class="options-panel" data-id="game-options-panel" hidden>
      <div class="options-panel-backdrop" data-options-close></div>
      <div class="options-panel-sheet" role="dialog" aria-modal="true">
        <div class="options-panel-header">
          <span class="options-panel-title" data-i18n="options">Options</span>
          <button type="button" class="options-panel-close" data-options-close data-id="tetris-options-close" aria-label="Fermer" data-i18n-aria="close">×</button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section" data-id="game-options-language">
            <p class="options-panel-section-title" data-i18n="language">Langue</p>
            <div class="tr-chips">
              <button type="button" class="tr-chip" data-lang="fr" data-id="tetris-lang-fr">FR</button>
              <button type="button" class="tr-chip" data-lang="en" data-id="tetris-lang-en">EN</button>
              <button type="button" class="tr-chip" data-lang="es" data-id="tetris-lang-es">ES</button>
            </div>
          </div>
          <div class="options-panel-section" data-id="tetris-options-sound">
            <p class="options-panel-section-title" data-i18n="sound">Son</p>
            <button type="button" class="tr-chip" data-id="tetris-sound-toggle" aria-pressed="true"></button>
          </div>
          <details class="options-panel-section" data-id="game-options-rules">
            <summary class="options-panel-section-title" data-i18n="rules">Règles</summary>
            <div class="rules-modal-content" data-id="tetris-rules-content"></div>
          </details>
        </div>
      </div>
    </div>

    <main class="tr-app" data-id="tetris-app">
      <section class="tr-start" data-id="tetris-start-screen" data-tv-screen>
        <div class="tr-card">
          <p class="tr-logo" aria-hidden="true">
            <span data-type="I">T</span><span data-type="L">E</span><span data-type="T">T</span><span data-type="S">R</span><span data-type="Z">I</span><span data-type="J">S</span>
          </p>
          <h2 class="tr-visually-hidden" data-i18n="title">Tetris</h2>
          <p class="tr-pitch" data-i18n="pitch"></p>
          <div class="tr-difficulty" data-id="tetris-difficulty">
            <p class="tr-difficulty-title" data-i18n="difficulty">Difficulté</p>
            <input
              type="range"
              class="tr-range"
              min="0"
              max="2"
              step="1"
              value="0"
              data-id="tetris-difficulty-slider"
              data-tv-keys="left right"
              aria-label="Difficulté"
              data-i18n-aria="difficulty"
            />
            <div class="tr-difficulty-marks">
              <span data-difficulty="easy" data-id="tetris-difficulty-easy" data-i18n="easy">Facile</span>
              <span data-difficulty="medium" data-id="tetris-difficulty-medium" data-i18n="medium">Moyen</span>
              <span data-difficulty="hard" data-id="tetris-difficulty-hard" data-i18n="hard">Difficile</span>
            </div>
          </div>
          <button type="button" class="tr-button tr-resume" data-id="tetris-resume-button" data-tv-focus hidden>
            <span data-i18n="resume">Reprendre</span>
            <span class="tr-info" data-resume-info></span>
          </button>
          <button type="button" class="tr-button" data-id="tetris-play-button" data-tv-focus>
            <span data-i18n="play">Jouer</span>
            <span class="tr-info" data-play-info></span>
          </button>
          <p class="tr-best" data-id="tetris-start-best"></p>
        </div>
      </section>

      <section class="tr-stage" data-id="tetris-stage" data-tv-screen hidden>
        <div class="tr-side tr-side-left" data-id="tetris-hud-left">
          <button type="button" class="tr-box tr-hold" data-pad="hold" data-id="tetris-hold-button" aria-label="Mettre en réserve" data-i18n-aria="holdButton">
            <span class="tr-label" data-i18n="hold">Réserve</span>
            <canvas class="tr-canvas tr-preview" data-id="tetris-hold-canvas" aria-hidden="true"></canvas>
          </button>
          <div class="tr-stat" data-id="tetris-score">
            <span class="tr-label" data-i18n="score">Score</span>
            <span class="tr-value" data-id="tetris-score-value">0</span>
          </div>
          <div class="tr-stat" data-id="tetris-lines">
            <span class="tr-label" data-i18n="lines">Lignes</span>
            <span class="tr-value" data-id="tetris-lines-value">0</span>
          </div>
          <div class="tr-stat" data-id="tetris-level">
            <span class="tr-label" data-i18n="level">Niveau</span>
            <span class="tr-value" data-id="tetris-level-value">1</span>
          </div>
        </div>
        <div class="tr-play" data-id="tetris-play-area">
          <div class="tr-well">
            <canvas
              class="tr-canvas tr-board"
              data-id="tetris-board"
              tabindex="0"
              data-tv-focus
              data-tv-keys="left right up down"
              role="img"
              data-i18n-aria="board"
            ></canvas>
            <p class="tr-toast" data-id="tetris-toast" aria-live="polite"></p>
          </div>
          <span class="tr-hint" data-zone="left" aria-hidden="true">◀</span>
          <span class="tr-hint" data-zone="right" aria-hidden="true">▶</span>
          <div class="tr-pads" data-id="tetris-pads">
            <button type="button" class="tr-pad" data-pad="left" data-id="tetris-pad-left" aria-label="Gauche" data-i18n-aria="left">◀</button>
            <button type="button" class="tr-pad tr-pad-drop" data-pad="drop" data-id="tetris-pad-drop" aria-label="Lâcher" data-i18n-aria="dropButton"><span class="tr-bar" aria-hidden="true"></span></button>
            <button type="button" class="tr-pad" data-pad="right" data-id="tetris-pad-right" aria-label="Droite" data-i18n-aria="right">▶</button>
            <button type="button" class="tr-pad" data-pad="cw" data-id="tetris-pad-rotate" aria-label="Tourner" data-i18n-aria="rotate">↻</button>
          </div>
        </div>
        <div class="tr-side tr-side-right" data-id="tetris-hud-right">
          <div class="tr-box" data-id="tetris-next">
            <span class="tr-label" data-i18n="next">Suivante</span>
            <canvas class="tr-canvas tr-preview" data-id="tetris-next-canvas" aria-hidden="true"></canvas>
          </div>
          <div class="tr-stat" data-id="tetris-best">
            <span class="tr-label" data-i18n="best">Record</span>
            <span class="tr-value" data-id="tetris-best-value">0</span>
          </div>
          <button type="button" class="tr-pause" data-id="tetris-pause-button" data-tv-back aria-label="Pause" data-i18n-aria="menuButton">❚❚</button>
        </div>
      </section>

      <div class="tr-overlay" data-id="tetris-paused" data-tv-overlay hidden>
        <div class="tr-card" role="dialog" aria-modal="true">
          <h2 class="tr-overlay-title" data-i18n="paused">Pause</h2>
          <button type="button" class="tr-button" data-id="tetris-continue-button" data-tv-focus data-tv-back data-i18n="continue"></button>
          <button type="button" class="tr-button tr-button-soft" data-id="tetris-paused-menu-button" data-match-quit data-i18n="menu"></button>
        </div>
      </div>

      <div class="tr-overlay tr-overlay-late" data-id="tetris-end" data-tv-overlay hidden>
        <div class="tr-card" role="dialog" aria-modal="true">
          <h2 class="tr-overlay-title" data-id="tetris-end-title"></h2>
          <p class="tr-score-line" data-id="tetris-end-score"></p>
          <p data-id="tetris-end-stats"></p>
          <p class="tr-best" data-id="tetris-end-best"></p>
          <button type="button" class="tr-button" data-id="tetris-replay-button" data-tv-focus data-i18n="replay"></button>
          <button type="button" class="tr-button tr-button-soft" data-id="tetris-end-menu-button" data-tv-back data-i18n="menu"></button>
        </div>
      </div>
    </main>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
