<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salade de Cafards</title>
  <link rel="stylesheet" href="/shared/css/game-header.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="mode-setup">
  <header class="game-nav">
    <div class="nav-side nav-left">
      <button id="backBtn" type="button" class="back-button" aria-label="Retour à l'écran de configuration"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
    </div>
    <div class="nav-center">
      <img
        src="./assets/thumbnail.jpg"
        alt="Salade de Cafards"
        class="nav-banner"
        onerror="this.style.display='none'"
      />
      <h1 id="nav-title" class="nav-title"></h1>
    </div>
    <div class="nav-side nav-right">
      <div class="timer-bar">
        <div id="timerLight" class="timer-light"></div>
        <p id="timerText"></p>
      </div>
      <button
        id="optionsBtn"
        class="options-button"
        type="button"
        aria-label="Options"
        aria-expanded="false"
        aria-controls="optionsPanel"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </div>
  </header>

  <div id="optionsPanel" class="options-panel" hidden>
    <div class="options-panel-backdrop" data-options-close></div>
    <div class="options-panel-sheet" role="dialog" aria-modal="true" aria-label="Options">
      <div class="options-panel-header">
        <span class="options-panel-title">Options</span>
        <button type="button" class="options-panel-close" data-options-close aria-label="Fermer">×</button>
      </div>
      <div class="options-panel-body">
        <div class="options-panel-section">
          <p class="options-panel-section-title">Langue</p>
          <div class="lang-switch">
            <button type="button" class="lang-btn active" data-lang="fr">FR</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
            <button type="button" class="lang-btn" data-lang="es">ES</button>
          </div>
        </div>
        <div class="options-panel-section">
          <p class="options-panel-section-title" data-i18n="rulesTitle">Regles</p>
          <iframe id="rulesFrame" class="rules-frame" title="Rules"></iframe>
        </div>
      </div>
    </div>
  </div>

  <section id="setup" class="setup-screen">
    <div class="setup-card">
      <p class="intro" data-i18n="intro">Configure la partie, puis touchez la pile active pour reveler chaque nouvelle carte.</p>
      <div class="setup-grid">
        <label><span data-i18n="players">Nombre de joueurs</span>
          <input id="playerCount" type="number" min="2" max="8" value="4" />
        </label>
        <label><span data-i18n="deck">Cartes totales</span>
          <input id="deckSize" type="number" min="32" max="256" step="8" value="128" />
        </label>
        <label><span data-i18n="winners">Nombre de gagnants</span>
          <input id="winnersCount" type="number" min="1" max="8" value="1" />
        </label>
        <label class="toggle"><span data-i18n="timer">Minuteur</span>
          <input id="timerEnabled" type="checkbox" checked />
          <span data-i18n="timerToggle">Activer la lumiere rouge</span>
        </label>
        <label><span data-i18n="timerSeconds">Secondes avant alerte</span>
          <input id="timerSeconds" type="number" min="0.5" max="5" step="0.5" value="1.5" />
        </label>
      </div>
      <button id="startBtn" type="button" class="start-btn" data-i18n="start">Lancer la partie</button>
    </div>
  </section>

  <main id="game" class="game">

    <section class="board" aria-label="Table de jeu">
      <article class="pile-shell active" data-pile="0">
        <button id="pileAHit" type="button" class="pile-hit" aria-label="Reveler une carte sur la pile A">
          <div id="pileA" class="pile"><span id="pileACta" class="pile-message"></span></div>
        </button>
      </article>
      <article class="pile-shell" data-pile="1">
        <button id="pileBHit" type="button" class="pile-hit" aria-label="Reveler une carte sur la pile B">
          <div id="pileB" class="pile"><span id="pileBCta" class="pile-message"></span></div>
        </button>
      </article>
    </section>

    <section id="players" class="players"></section>
  </main>

  <div id="winnerOverlay" class="winner-overlay" hidden>
    <div class="winner-panel">
      <div id="winnerText" class="winner-text">Player 1 win!</div>
      <div id="confettiLayer" class="confetti-layer"></div>
    </div>
  </div>

  <template id="cardTpl">
    <article class="card">
      <div class="card-top"></div>
      <div class="card-face"></div>
      <div class="card-tag"></div>
    </article>
  </template>

  <script src="/shared/js/game-header.js"></script>
  <script defer src="game.js"></script>
</body>
</html>
