<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TTCF</title>
  <link rel="stylesheet" href="/shared/css/base.css" />
  <link rel="stylesheet" href="/shared/css/game-header.css" />
  <link rel="stylesheet" href="./ttcf.css" />
  <script src="/shared/js/tv-remote.js"></script>
</head>
<body data-match-saved>
  <header class="game-nav">
    <div class="nav-side nav-left">
      <a href="/" class="back-button" data-id="game-back-button" data-tv-back aria-label="Retour" data-i18n-aria="back">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </a>
      <button type="button" class="back-button" data-id="ttcf-quit-button" data-match-quit data-tv-back aria-label="Quitter la partie" data-i18n-aria="quit" hidden><span aria-hidden="true">✕</span></button>
    </div>
    <div class="nav-center">
      <h1 class="nav-title">TTCF</h1>
    </div>
    <div class="nav-side nav-right">
      <button id="settingsButton" class="options-button" type="button" data-id="game-options-button" aria-label="Options" data-i18n-aria="options" aria-expanded="false" aria-controls="settingsPanel">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
      </button>
    </div>
  </header>

  <div id="settingsPanel" class="options-panel" data-id="game-options-panel" hidden>
    <div class="options-panel-backdrop" data-options-close></div>
    <div class="options-panel-sheet" role="dialog" aria-modal="true" aria-label="Options" data-i18n-aria="options">
      <div class="options-panel-header">
        <span class="options-panel-title" data-i18n="options">Options</span>
        <button type="button" class="options-panel-close" data-options-close data-id="ttcf-options-close" aria-label="Fermer" data-i18n-aria="close">×</button>
      </div>
      <div class="options-panel-body">
        <div class="options-panel-section" data-id="game-options-language">
          <p class="options-panel-section-title" data-i18n="language">Langue</p>
          <div class="langWrap" role="group" aria-label="Langue" data-i18n-aria="language">
            <button class="chip langBtn" data-lang="fr" data-id="ttcf-lang-fr" type="button">FR</button>
            <button class="chip langBtn" data-lang="en" data-id="ttcf-lang-en" type="button">EN</button>
            <button class="chip langBtn" data-lang="es" data-id="ttcf-lang-es" type="button">ES</button>
          </div>
        </div>
        <details class="options-panel-section" data-id="ttcf-options-categories">
          <summary class="options-panel-section-title" data-i18n="categories">Catégories</summary>
          <div class="rules-modal-content" data-id="ttcf-categories-content" data-i18n-html="categoriesBody"></div>
        </details>
        <details class="options-panel-section" data-id="game-options-rules">
          <summary class="options-panel-section-title" data-i18n="rules">Règles</summary>
          <div class="rules-modal-content" data-id="ttcf-rules-content" data-i18n-html="rulesBody"></div>
        </details>
      </div>
    </div>
  </div>

  <main class="container" data-id="ttcf-shell">
    <!-- Game Dashboard: title, resume, teams, start -->
    <section id="setupScreen" class="screen" data-id="ttcf-setup-screen" data-tv-screen>
      <div class="setup-card">
        <!-- Hidden until ttcf.js knows whether Resume shows (then the row makes room for it). -->
        <div class="setup-hero" data-id="ttcf-setup-hero" aria-hidden="true" hidden>
          <img src="./assets/token-red.webp" alt="" draggable="false" />
          <img src="./assets/token-blue.webp" alt="" draggable="false" />
          <img src="./assets/token-yellow.webp" alt="" draggable="false" />
          <img src="./assets/token-purple.webp" alt="" draggable="false" />
          <img src="./assets/token-orange.webp" alt="" draggable="false" />
          <img src="./assets/token-green.webp" alt="" draggable="false" />
          <img src="./assets/token-pink.webp" alt="" draggable="false" />
          <img src="./assets/token-brown.webp" alt="" draggable="false" />
        </div>
        <h2 class="setup-title" data-i18n="title">Tu te crois fort ?</h2>
        <button type="button" id="resumeBtn" class="btn primary" data-id="ttcf-resume-button" data-tv-focus data-i18n="resume" hidden>Reprendre la partie</button>
        <div class="mode-row" role="group" aria-label="Mode de jeu" data-i18n-aria="mode" data-id="ttcf-mode-choice">
          <button type="button" class="chip mode-chip" data-mode="board" data-id="ttcf-mode-board" data-i18n="modeBoard">Plateau</button>
          <button type="button" class="chip mode-chip" data-mode="wheel" data-id="ttcf-mode-wheel" data-i18n="modeWheel">Roue de la fortune</button>
        </div>
        <label class="latino-row" data-id="ttcf-latino-row" hidden><input type="checkbox" data-id="ttcf-latino-check" /><span data-i18n="latino">Extension Latino</span></label>
        <p class="setup-label" data-i18n="teams">Équipes</p>
        <div id="teamsList" class="teams-list" data-id="ttcf-teams-list"></div>
        <button type="button" id="addTeamBtn" class="btn secondary" data-id="ttcf-add-team-btn" data-i18n="addTeam">+ Ajouter équipe</button>
        <p class="setup-status" data-id="ttcf-load-status" role="status" data-i18n="loading"></p>
        <button type="button" id="startBtn" class="btn primary" data-id="ttcf-start-btn" data-tv-focus data-i18n="start" disabled>Hésite pas à débuter !</button>
      </div>
    </section>

    <!-- Board Screen -->
    <section id="boardScreen" class="screen" data-id="ttcf-board-screen" data-tv-screen hidden>
      <div class="board-header">
        <h2 id="turnIndicator" data-id="ttcf-turn-indicator"></h2>
      </div>

      <div class="board-area" data-id="ttcf-board-area">
      <div class="board-track" id="boardTrack" data-id="ttcf-board-track" role="group" aria-label="Plateau" data-i18n-aria="board">
        <!-- Spaces generated by JS -->
      </div>
      </div>

      <div class="wheel-area" data-id="ttcf-wheel-area" hidden>
        <div class="wheel-stage">
          <div class="wheel-pointer" aria-hidden="true"></div>
          <div class="wheel" data-id="ttcf-wheel"></div>
        </div>
        <ol class="wheel-scores" data-id="ttcf-wheel-scores" aria-label="Équipes" data-i18n-aria="teams"></ol>
      </div>

      <div class="board-actions">
        <button type="button" id="drawCardBtn" class="btn primary" data-id="ttcf-draw-card-btn" data-tv-focus data-i18n="draw">Tirer une carte</button>
        <button type="button" class="btn primary" data-id="ttcf-spin-btn" data-tv-focus data-i18n="spin" hidden>Lancer la roue</button>
      </div>
    </section>

    <!-- Card Modal -->
    <div id="cardModal" class="modal" data-id="ttcf-card-modal" data-tv-screen hidden>
      <div class="modal-content card-bg" id="cardModalContent" role="dialog" aria-modal="true">
        <div class="card-header">
          <button type="button" class="card-flip" data-id="ttcf-card-flip" aria-label="Retourner la carte" data-i18n-aria="flipCard" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button type="button" class="card-close" data-id="ttcf-card-close" data-tv-back aria-label="Annuler la question" data-i18n-aria="cancelQuestion" hidden>×</button>
          <img class="card-medallion" data-id="ttcf-card-medallion" src="./assets/medallions/debuter.webp" alt="" draggable="false" />
          <span id="cardTheme" class="card-theme" data-id="ttcf-card-theme"></span>
        </div>
        <div class="card-body">
          <h3 id="cardSubject" class="card-subject" data-id="ttcf-card-subject"></h3>
          <p class="bonus-rule" data-id="ttcf-bonus-rule" hidden></p>

          <!-- Superbe card: its rule and its theme, then a card of that theme is played. -->
          <div id="bonusStep" hidden data-id="ttcf-bonus-step">
            <p class="bonus-theme" data-id="ttcf-bonus-theme"></p>
            <p class="card-text" data-id="ttcf-bonus-text"></p>
            <div class="bonus-choices" data-id="ttcf-bonus-choices"></div>
          </div>

          <div id="evaluationStep" data-id="ttcf-eval-step">
            <p data-i18n="howMuch">Tu te crois fort ?</p>
            <div class="eval-grid" id="evalGrid" data-id="ttcf-eval-grid">
              <!-- Buttons 1 to 10 -->
            </div>
          </div>

          <div id="questionStep" hidden data-id="ttcf-question-step">
            <div class="selected-note" id="selectedNote" data-id="ttcf-selected-note"></div>
            <p id="cardQuestion" class="card-text" data-id="ttcf-card-question"></p>

            <button type="button" id="showAnswerBtn" class="btn secondary" data-id="ttcf-show-answer-btn" data-tv-focus data-i18n="showAnswer">Voir la réponse</button>
          </div>

          <div id="answerStep" hidden data-id="ttcf-answer-step">
            <p class="answer-label" data-i18n="answer">Réponse :</p>
            <p id="cardAnswer" class="card-text" data-id="ttcf-card-answer"></p>

            <div id="validationButtons" class="validation-buttons">
              <button type="button" id="failBtn" class="btn danger" data-id="ttcf-fail-btn"></button>
              <button type="button" id="successBtn" class="btn success" data-id="ttcf-success-btn" data-tv-focus></button>
            </div>

            <div id="manualMoveUi" class="manual-move-ui" hidden data-id="ttcf-manual-move">
              <p data-i18n="moveBy">Avancer de :</p>
              <div class="stepper">
                <button type="button" id="manualMoveDec" class="btn secondary" data-id="ttcf-move-less" aria-label="Moins" data-i18n-aria="less">-</button>
                <span id="manualMoveValue" class="stepper-val" data-id="ttcf-move-value">0</span>
                <button type="button" id="manualMoveInc" class="btn secondary" data-id="ttcf-move-more" aria-label="Plus" data-i18n-aria="more">+</button>
              </div>
              <button type="button" id="manualMoveConfirm" class="btn primary full-width" data-id="ttcf-move-confirm" data-tv-focus data-i18n="confirmMove">Valider le déplacement</button>
            </div>
          </div>

          <button type="button" class="btn card-skip" data-id="ttcf-skip-btn" data-i18n="skip" hidden>Passer la question</button>
        </div>
      </div>
      <!-- Under the card, so it does not turn with it. -->
      <div class="timer-bar" data-id="ttcf-timer" hidden><div id="timerFill" class="timer-fill"></div></div>
      <!-- Bottom of the screen: the other two languages, to read the card in one of them. -->
      <div class="card-lang" role="group" aria-label="Langue" data-i18n-aria="language" data-id="ttcf-card-lang">
        <button class="card-lang-btn" data-lang="fr" data-id="ttcf-card-lang-fr" type="button" aria-label="Français"><img src="./assets/flags/fr.svg" alt="" draggable="false" /></button>
        <button class="card-lang-btn" data-lang="en" data-id="ttcf-card-lang-en" type="button" aria-label="English"><img src="./assets/flags/en.svg" alt="" draggable="false" /></button>
        <button class="card-lang-btn" data-lang="es" data-id="ttcf-card-lang-es" type="button" aria-label="Español"><img src="./assets/flags/es.svg" alt="" draggable="false" /></button>
      </div>
    </div>

    <!-- Win Screen -->
    <section id="winScreen" class="screen" data-id="ttcf-win-screen" data-tv-screen hidden>
      <div class="setup-card win-card">
        <div class="win-hero" aria-hidden="true">
          <img class="win-medallion" src="./assets/medallions/gagner.webp" alt="" draggable="false" />
          <img class="win-token" data-id="ttcf-winner-token" src="./assets/token-red.webp" alt="" draggable="false" />
        </div>
        <h2 id="winnerName" data-id="ttcf-winner-name"></h2>
        <p data-i18n="won">A remporté la partie !</p>
        <button type="button" id="restartBtn" class="btn primary" data-id="ttcf-restart-btn" data-tv-focus data-i18n="newGame">Nouvelle partie</button>
        <button type="button" id="menuBtn" class="btn secondary" data-id="ttcf-menu-button" data-tv-back data-i18n="menu">Menu du jeu</button>
      </div>
    </section>
  </main>

  <script src="/shared/js/game-header.js"></script>
  <script src="/shared/js/game-session.js"></script>
  <script type="module" src="./ttcf.js"></script>
</body>
</html>
