<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b0a4a" />
    <title>Fruit Slash</title>
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="start.css" />
    <link rel="stylesheet" href="stage.css" />
  </head>
  <body data-match-saved>
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a
          class="back-button"
          href="/"
          data-id="game-back-button"
          aria-label="Retour"
          data-i18n-aria="back"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-i18n="title">Fruit Slash</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          type="button"
          data-id="game-options-button"
          aria-label="Options"
          data-i18n-aria="options"
          aria-expanded="false"
          aria-controls="optionsPanel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="optionsPanel"
      class="options-panel"
      data-id="game-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div class="options-panel-sheet" role="dialog" aria-modal="true">
        <div class="options-panel-header">
          <span class="options-panel-title" data-i18n="options">Options</span>
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="fruitslash-options-close"
            aria-label="Fermer"
            data-i18n-aria="close"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section" data-id="game-options-language">
            <p class="options-panel-section-title" data-i18n="language">
              Langue
            </p>
            <div class="fs-chips">
              <button
                type="button"
                class="fs-chip"
                data-lang="fr"
                data-id="fruitslash-lang-fr"
              >
                FR
              </button>
              <button
                type="button"
                class="fs-chip"
                data-lang="en"
                data-id="fruitslash-lang-en"
              >
                EN
              </button>
              <button
                type="button"
                class="fs-chip"
                data-lang="es"
                data-id="fruitslash-lang-es"
              >
                ES
              </button>
            </div>
          </div>
          <div class="options-panel-section" data-id="fruitslash-options-sound">
            <p class="options-panel-section-title" data-i18n="sound">Son</p>
            <button
              type="button"
              class="fs-chip"
              data-id="fruitslash-sound-toggle"
              aria-pressed="true"
            ></button>
          </div>
          <details class="options-panel-section" data-id="game-options-rules">
            <summary class="options-panel-section-title" data-i18n="rules">
              Règles
            </summary>
            <div
              class="rules-modal-content"
              data-id="fruitslash-rules-content"
            ></div>
          </details>
        </div>
      </div>
    </div>

    <main class="fs-app" data-id="fruitslash-app">
      <section class="fs-start" data-id="fruitslash-start-screen">
        <div class="fs-card">
          <p class="fs-parade" aria-hidden="true">
            <span>🍉</span><span>🍭</span><span>🎈</span><span>🚀</span
            ><span>🍓</span>
          </p>
          <h2 class="fs-logo" data-i18n="title">Fruit Slash</h2>
          <p class="fs-pitch" data-i18n="pitch"></p>
          <button
            type="button"
            class="fs-button fs-resume"
            data-id="fruitslash-resume-button"
            hidden
          >
            <span data-i18n="resume">Reprendre</span>
            <span class="fs-resume-info" data-resume-info></span>
          </button>
          <p class="fs-step" data-i18n="chooseTheme"></p>
          <div class="fs-themes" data-id="fruitslash-theme-list">
            <button
              type="button"
              class="fs-theme"
              data-theme="fruits"
              data-id="fruitslash-theme-fruits"
            >
              <span class="fs-theme-icon" aria-hidden="true">🍓</span>
              <span data-i18n="fruits"></span>
            </button>
            <button
              type="button"
              class="fs-theme"
              data-theme="veggies"
              data-id="fruitslash-theme-veggies"
            >
              <span class="fs-theme-icon" aria-hidden="true">🥕</span>
              <span data-i18n="veggies"></span>
            </button>
            <button
              type="button"
              class="fs-theme"
              data-theme="sweets"
              data-id="fruitslash-theme-sweets"
            >
              <span class="fs-theme-icon" aria-hidden="true">🍭</span>
              <span data-i18n="sweets"></span>
            </button>
            <button
              type="button"
              class="fs-theme"
              data-theme="toys"
              data-id="fruitslash-theme-toys"
            >
              <span class="fs-theme-icon" aria-hidden="true">🧸</span>
              <span data-i18n="toys"></span>
            </button>
            <button
              type="button"
              class="fs-theme"
              data-theme="space"
              data-id="fruitslash-theme-space"
            >
              <span class="fs-theme-icon" aria-hidden="true">🚀</span>
              <span data-i18n="space"></span>
            </button>
            <button
              type="button"
              class="fs-theme"
              data-theme="mix"
              data-id="fruitslash-theme-mix"
            >
              <span class="fs-theme-icon" aria-hidden="true">🌈</span>
              <span data-i18n="mix"></span>
            </button>
          </div>
          <p class="fs-step" data-i18n="chooseMode"></p>
          <div class="fs-modes">
            <button
              type="button"
              class="fs-button fs-mode fs-mode-kids"
              data-mode="kids"
              data-id="fruitslash-start-kids"
            >
              <span class="fs-mode-icon" aria-hidden="true">🐣</span>
              <span data-i18n="kids"></span>
              <span class="fs-mode-hint" data-i18n="kidsHint"></span>
            </button>
            <button
              type="button"
              class="fs-button fs-mode fs-mode-ninja"
              data-mode="ninja"
              data-id="fruitslash-start-ninja"
            >
              <span class="fs-mode-icon" aria-hidden="true">🥷</span>
              <span data-i18n="ninja"></span>
              <span class="fs-mode-hint" data-i18n="ninjaHint"></span>
            </button>
          </div>
          <p class="fs-best" data-id="fruitslash-start-best"></p>
        </div>
      </section>

      <section class="fs-stage" data-id="fruitslash-stage" hidden>
        <div class="fs-board" data-id="fruitslash-board">
          <canvas
            class="fs-canvas"
            data-id="fruitslash-canvas"
            role="img"
            data-i18n-aria="canvas"
          ></canvas>
        </div>
        <div class="fs-hud" data-id="fruitslash-hud">
          <div class="fs-pill" data-id="fruitslash-hud-score">
            <span class="fs-pill-label" data-i18n="score">Points</span>
            <span class="fs-pill-value" data-hud="score">0</span>
          </div>
          <div class="fs-pill fs-pill-time" data-id="fruitslash-hud-time">
            <span class="fs-pill-label" data-i18n="time">Temps</span>
            <span class="fs-pill-value" data-hud="time">60</span>
          </div>
          <button
            type="button"
            class="fs-pause"
            data-id="fruitslash-pause-button"
            aria-label="Pause"
            data-i18n-aria="pause"
          >
            ⏸
          </button>
        </div>

        <div class="fs-overlay" data-id="fruitslash-paused" hidden>
          <div class="fs-card">
            <h2 class="fs-overlay-title" data-i18n="paused"></h2>
            <button
              type="button"
              class="fs-button"
              data-id="fruitslash-continue-button"
              data-i18n="continue"
            ></button>
          </div>
        </div>

        <div class="fs-overlay" data-id="fruitslash-end" hidden>
          <div class="fs-card">
            <p class="fs-stars" data-id="fruitslash-end-stars"></p>
            <h2 class="fs-overlay-title" data-i18n="endTitle"></h2>
            <p class="fs-score-line" data-id="fruitslash-end-score"></p>
            <p data-id="fruitslash-end-sliced"></p>
            <p data-id="fruitslash-end-combo"></p>
            <p class="fs-best" data-id="fruitslash-end-best"></p>
            <button
              type="button"
              class="fs-button"
              data-id="fruitslash-replay-button"
              data-i18n="replay"
            ></button>
            <button
              type="button"
              class="fs-button fs-button-soft"
              data-id="fruitslash-menu-button"
              data-i18n="menu"
            ></button>
          </div>
        </div>
      </section>
    </main>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
