<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TTMC</title>
  <link rel="stylesheet" href="/shared/css/base.css" />
  <link rel="stylesheet" href="/shared/css/game-header.css" />
  <link rel="stylesheet" href="./ttmc.css" />
  <script src="/shared/js/tv-remote.js"></script>
</head>
<body data-match-saved>
  <header class="game-nav">
    <div class="nav-side nav-left">
      <a href="/" class="back-button" data-id="game-back-button" data-tv-back aria-label="Retour" data-i18n-aria="back">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </a>
      <button type="button" class="back-button" data-id="ttmc-quit-button" data-match-quit data-tv-back aria-label="Quitter la partie" data-i18n-aria="quit" hidden><span aria-hidden="true">✕</span></button>
    </div>
    <div class="nav-center">
      <h1 class="nav-title">TTMC</h1>
    </div>
    <div class="nav-side nav-right">
      <button id="settingsButton" class="options-button" type="button" data-id="game-options-button" aria-label="Options" data-i18n-aria="options" aria-expanded="false" aria-controls="settingsPanel">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
      </button>
    </div>
  </header>

  <div id="settingsPanel" class="options-panel" data-id="game-options-panel" hidden>
    <div class="options-panel-backdrop" data-options-close></div>
    <div class="options-panel-sheet" role="dialog" aria-modal="true" aria-label="Options" data-i18n-aria="options">
      <div class="options-panel-header">
        <span class="options-panel-title" data-i18n="options">Options</span>
        <button type="button" class="options-panel-close" data-options-close data-id="ttmc-options-close" aria-label="Fermer" data-i18n-aria="close">×</button>
      </div>
      <div class="options-panel-body">
        <div class="options-panel-section" data-id="game-options-language">
          <p class="options-panel-section-title" data-i18n="language">Langue</p>
          <div class="langWrap" role="group" aria-label="Langue" data-i18n-aria="language">
            <button class="chip langBtn" data-lang="fr" data-id="ttmc-lang-fr" type="button">FR</button>
            <button class="chip langBtn" data-lang="en" data-id="ttmc-lang-en" type="button">EN</button>
            <button class="chip langBtn" data-lang="es" data-id="ttmc-lang-es" type="button">ES</button>
          </div>
        </div>
        <details class="options-panel-section" data-id="game-options-rules">
          <summary class="options-panel-section-title" data-i18n="rules">Règles</summary>
          <div class="rules-modal-content" data-id="ttmc-rules-content" data-i18n-html="rulesBody"></div>
        </details>
      </div>
    </div>
  </div>

  <main class="container" data-id="ttmc-shell">
    <!-- Game Dashboard: title, resume, teams, start -->
    <section id="setupScreen" class="screen" data-id="ttmc-setup-screen" data-tv-screen>
      <div class="setup-card">
        <h2 class="setup-title" data-i18n="title">Tu te mets combien ?</h2>
        <button type="button" id="resumeBtn" class="btn primary" data-id="ttmc-resume-button" data-tv-focus data-i18n="resume" hidden>Reprendre la partie</button>
        <p class="setup-label" data-i18n="teams">Équipes</p>
        <div id="teamsList" class="teams-list" data-id="ttmc-teams-list"></div>
        <button type="button" id="addTeamBtn" class="btn secondary" data-id="ttmc-add-team-btn" data-i18n="addTeam">+ Ajouter équipe</button>
        <p class="setup-status" data-id="ttmc-load-status" role="status" data-i18n="loading"></p>
        <button type="button" id="startBtn" class="btn primary" data-id="ttmc-start-btn" data-tv-focus data-i18n="start" disabled>Hésite pas à débuter !</button>
      </div>
    </section>

    <!-- Board Screen -->
    <section id="boardScreen" class="screen" data-id="ttmc-board-screen" data-tv-screen hidden>
      <div class="board-header">
        <h2 id="turnIndicator" data-id="ttmc-turn-indicator"></h2>
      </div>

      <div class="board-area" data-id="ttmc-board-area">
      <div class="board-track" id="boardTrack" data-id="ttmc-board-track" role="group" aria-label="Plateau" data-i18n-aria="board">
        <!-- Spaces generated by JS -->
      </div>
      </div>

      <div class="board-actions">
        <button type="button" id="drawCardBtn" class="btn primary" data-id="ttmc-draw-card-btn" data-tv-focus data-i18n="draw">Tirer une carte</button>
      </div>
    </section>

    <!-- Card Modal -->
    <div id="cardModal" class="modal" data-id="ttmc-card-modal" data-tv-screen hidden>
      <div class="modal-content card-bg" id="cardModalContent" role="dialog" aria-modal="true">
        <div class="card-header">
          <span id="cardTheme" class="card-theme" data-id="ttmc-card-theme"></span>
        </div>
        <div class="card-body">
          <h3 id="cardSubject" class="card-subject" data-id="ttmc-card-subject"></h3>

          <div id="evaluationStep" data-id="ttmc-eval-step">
            <p data-i18n="howMuch">Tu te mets combien ?</p>
            <div class="eval-grid" id="evalGrid" data-id="ttmc-eval-grid">
              <!-- Buttons 1 to 10 -->
            </div>
          </div>

          <div id="questionStep" hidden data-id="ttmc-question-step">
            <div class="selected-note" id="selectedNote" data-id="ttmc-selected-note"></div>
            <p id="cardQuestion" class="card-text" data-id="ttmc-card-question"></p>

            <div class="timer-bar" data-id="ttmc-timer"><div id="timerFill" class="timer-fill"></div></div>

            <button type="button" id="showAnswerBtn" class="btn secondary" data-id="ttmc-show-answer-btn" data-tv-focus data-i18n="showAnswer">Voir la réponse</button>
          </div>

          <div id="answerStep" hidden data-id="ttmc-answer-step">
            <p class="answer-label" data-i18n="answer">Réponse :</p>
            <p id="cardAnswer" class="card-text" data-id="ttmc-card-answer"></p>

            <div id="validationButtons" class="validation-buttons">
              <button type="button" id="failBtn" class="btn danger" data-id="ttmc-fail-btn"></button>
              <button type="button" id="successBtn" class="btn success" data-id="ttmc-success-btn" data-tv-focus></button>
            </div>

            <div id="manualMoveUi" class="manual-move-ui" hidden data-id="ttmc-manual-move">
              <p data-i18n="moveBy">Avancer de :</p>
              <div class="stepper">
                <button type="button" id="manualMoveDec" class="btn secondary" data-id="ttmc-move-less" aria-label="Moins" data-i18n-aria="less">-</button>
                <span id="manualMoveValue" class="stepper-val" data-id="ttmc-move-value">0</span>
                <button type="button" id="manualMoveInc" class="btn secondary" data-id="ttmc-move-more" aria-label="Plus" data-i18n-aria="more">+</button>
              </div>
              <button type="button" id="manualMoveConfirm" class="btn primary full-width" data-id="ttmc-move-confirm" data-tv-focus data-i18n="confirmMove">Valider le déplacement</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Win Screen -->
    <section id="winScreen" class="screen" data-id="ttmc-win-screen" data-tv-screen hidden>
      <div class="setup-card">
        <h2 id="winnerName" data-id="ttmc-winner-name"></h2>
        <p data-i18n="won">A remporté la partie !</p>
        <button type="button" id="restartBtn" class="btn primary" data-id="ttmc-restart-btn" data-tv-focus data-i18n="newGame">Nouvelle partie</button>
        <button type="button" id="menuBtn" class="btn secondary" data-id="ttmc-menu-button" data-tv-back data-i18n="menu">Menu du jeu</button>
      </div>
    </section>
  </main>

  <script src="/shared/js/game-header.js"></script>
  <script src="/shared/js/game-session.js"></script>
  <script type="module" src="./ttmc.js"></script>
</body>
</html>
