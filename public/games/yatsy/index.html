<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yatzy Online Duel</title>
  <link rel="stylesheet" href="/shared/css/game-header.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-splash">
  <main class="page">
    <div class="app-shell">
      <section class="splash-screen" id="splash-screen" data-id="yatsy-splash-screen" aria-label="Game setup">
        <a class="splash-nav-btn splash-back-button" id="splash-back-button" href="/" data-id="yatsy-splash-back" aria-label="Go back to game hub" title="Go back to game hub">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </a>
        <button class="splash-nav-btn" id="settings-button" type="button" data-id="yatsy-splash-settings" aria-label="Game settings" title="Game settings" aria-expanded="false" aria-controls="settings-panel">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
        <section class="settings-panel" id="settings-panel" data-id="yatsy-splash-settings-panel" aria-label="Game settings" hidden>
          <div class="settings-list" id="settings-list"></div>
          <div class="settings-rules-section" id="settings-rules-section" data-id="yatsy-settings-rules-section" style="display: none">
            <p class="settings-rules-title" id="settings-rules-title" data-id="yatsy-settings-rules-title"></p>
            <div class="settings-rules-content" id="settings-rules-content" data-id="yatsy-settings-rules-content"></div>
          </div>
        </section>

        <div class="splash-actions" data-id="yatsy-splash-actions">
          <h1 class="splash-title" id="splash-title">Yatzy</h1>

          <button class="splash-choice splash-choice-local" id="solo-game-button" type="button" data-id="yatsy-solo-game-button">Partie à deux</button>
          <button class="splash-choice splash-choice-robot" id="robot-game-button" type="button" data-id="yatsy-robot-game-button">Partie solo</button>
          <button class="splash-choice splash-choice-robot-test" id="robot-test-game-button" type="button" data-id="yatsy-robot-test-game-button">Jouer solo (test)</button>
          <button class="splash-play" id="play-online-button" type="button" data-id="yatsy-play-online-button">Play Online</button>

          <div class="splash-name-row is-hidden" id="player-name-row" data-id="yatsy-player-name-row">
            <div class="splash-name-heading">
              <img class="player-name-avatar" id="player-name-avatar" data-id="yatsy-player-name-avatar" alt="" hidden>
              <label class="splash-label" for="player-name-input" id="player-name-label">Ton nom</label>
            </div>
            <input class="splash-name-input" id="player-name-input" type="text" maxlength="40" autocomplete="name" placeholder="Ton nom" data-id="yatsy-player-name-input">
          </div>
          <button class="splash-play is-hidden" id="create-game-button" type="button" data-id="yatsy-create-game-button">Créer une partie</button>
          <button class="splash-share is-hidden" id="share-game-button" type="button" data-id="yatsy-share-game-button">Partager le lien</button>
          <button class="splash-cancel" id="cancel-create-button" type="button" data-id="yatsy-cancel-create-button">Cancel Waiting Room</button>

          <p class="splash-status" id="splash-status" aria-live="polite"></p>
          <p class="splash-error" id="splash-error" aria-live="polite"></p>

          <div class="splash-join is-hidden" id="splash-join" data-id="yatsy-splash-join">
            <p class="splash-label" id="join-label">Join with 3-letter code</p>
            <div class="splash-join-row">
              <input class="splash-code-input" id="join-code-input" type="text" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC" aria-label="3-letter game code" data-id="yatsy-join-code-input">
              <button class="splash-join-button" id="join-game-button" type="button" data-id="yatsy-join-game-button">Join Game</button>
            </div>
          </div>
        </div>
      </section>

      <section class="game-card" id="game-card" aria-label="Yatzy score board and controls">
        <header class="game-header">
          <div class="game-header-row">
            <button class="home-button is-hidden" id="home-button" type="button" aria-label="Retour a l'accueil" title="Retour a l'accueil">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            </button>
            <div class="header-title">
              <h1 id="game-title">Yams</h1>
              <button class="restart-button" id="restart-button" type="button" aria-label="Restart" title="Restart">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.3M3 4v5h5"/></svg>
              </button>
            </div>

            <section class="score-summary" id="score-summary" aria-label="Current scores"></section>
            <button class="options-button game-settings-button" id="game-settings-button" type="button" data-id="yatsy-game-settings-button" aria-label="Game settings" title="Game settings" aria-expanded="false" aria-controls="game-settings-panel">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
            </button>
          </div>

          <div class="options-panel" id="game-settings-panel" data-id="yatsy-game-settings-panel" hidden>
            <div class="options-panel-backdrop" data-options-close></div>
            <div class="options-panel-sheet" role="dialog" aria-modal="true" aria-label="Game settings">
              <div class="options-panel-header">
                <span class="options-panel-title" id="game-settings-title">Game settings</span>
                <button type="button" class="options-panel-close" data-options-close id="game-settings-close" aria-label="Close">×</button>
              </div>
              <div class="options-panel-body">
                <div class="options-panel-section">
                  <p class="options-panel-section-title" id="game-settings-language-title">Language</p>
                  <div class="lang-selector" id="game-lang-selector" data-id="yatsy-game-lang-selector"></div>
                </div>
                <div class="options-panel-section">
                  <label class="game-toggle-row" for="game-reverse-selection-toggle">
                    <span class="game-toggle-name" id="game-reverse-selection-label">Reverse dice selection</span>
                    <span class="game-toggle-control">
                      <input type="checkbox" id="game-reverse-selection-toggle" data-id="yatsy-game-reverse-selection-toggle">
                      <span class="game-toggle-pill" id="game-reverse-selection-pill">OFF</span>
                    </span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </header>

        <section class="scoreboard-panel">
          <div class="scoreboard" id="scoreboard" aria-label="Score board"></div>
        </section>

        <section class="dice-section" aria-label="Dice tray">
          <div class="dice-row" id="dice-row"></div>
        </section>

        <section class="controls-panel">
          <button class="roll-button" id="roll-button" type="button">
            <span class="roll-label" id="roll-label">LANCER</span>
            <span class="roll-indicators" id="roll-indicators" aria-hidden="true"></span>
          </button>
          <button class="go-back-button is-hidden" id="go-back-button" type="button">
            Go back
          </button>
        </section>

        <div class="emoji-trigger" id="emoji-trigger" data-id="emoji-trigger">
          <div class="emoji-picker-backdrop is-hidden" id="emoji-picker-backdrop" data-id="emoji-picker-backdrop" aria-hidden="true"></div>
          <div class="emoji-picker is-hidden" id="emoji-picker" data-id="emoji-picker" role="dialog" aria-label="Reactions"></div>
          <button class="emoji-trigger-button" id="emoji-button" type="button" data-id="emoji-send-button" aria-haspopup="true" aria-expanded="false">
            <span aria-hidden="true">😊</span>
          </button>
        </div>

        <div class="celebration-layer" id="celebration-layer" aria-hidden="true"></div>
      </section>
    </div>
  </main>

  <div class="build-tag" id="build-tag" data-id="yatsy-build-tag" aria-hidden="true">v0.4</div>

  <script src="/shared/js/game-header.js"></script>
  <script src="/shared/js/player-profile.js"></script>
  <script src="/shared/js/profile-results.js"></script>
  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="supabase-config.js"></script>
  <script src="i18n.js"></script>
  <script src="gif-picker.js"></script>
  <script src="emoji.js"></script>
  <script src="robot.js"></script>
  <script src="matchmaking.js"></script>
  <script src="scoring.js"></script>
  <script src="random.js"></script>
  <script src="render.js"></script>
  <script src="session.js"></script>
  <script src="app.js"></script>
</body>
</html>
