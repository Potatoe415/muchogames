<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8fd3ff" />
    <title>Piou</title>
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="stage.css" />
    <script src="/shared/js/tv-remote.js"></script>
  </head>
  <body data-match-saved>
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a
          class="back-button"
          href="/"
          data-id="game-back-button"
          data-tv-back
          aria-label="Retour"
          data-i18n-aria="back"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-i18n="title">Piou</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          type="button"
          data-id="game-options-button"
          aria-label="Options"
          data-i18n-aria="options"
          aria-expanded="false"
          aria-controls="optionsPanel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="optionsPanel"
      class="options-panel"
      data-id="game-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div class="options-panel-sheet" role="dialog" aria-modal="true">
        <div class="options-panel-header">
          <span class="options-panel-title" data-i18n="options">Options</span>
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="piou-options-close"
            aria-label="Fermer"
            data-i18n-aria="close"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section" data-id="game-options-language">
            <p class="options-panel-section-title" data-i18n="language">
              Langue
            </p>
            <div class="pi-chips">
              <button
                type="button"
                class="pi-chip"
                data-lang="fr"
                data-id="piou-lang-fr"
              >
                FR
              </button>
              <button
                type="button"
                class="pi-chip"
                data-lang="en"
                data-id="piou-lang-en"
              >
                EN
              </button>
              <button
                type="button"
                class="pi-chip"
                data-lang="es"
                data-id="piou-lang-es"
              >
                ES
              </button>
            </div>
          </div>
          <div class="options-panel-section" data-id="piou-options-sound">
            <p class="options-panel-section-title" data-i18n="sound">Son</p>
            <button
              type="button"
              class="pi-chip"
              data-id="piou-sound-toggle"
              aria-pressed="true"
            ></button>
          </div>
          <details class="options-panel-section" data-id="game-options-rules">
            <summary class="options-panel-section-title" data-i18n="rules">
              Règles
            </summary>
            <div class="rules-modal-content" data-id="piou-rules-content"></div>
          </details>
        </div>
      </div>
    </div>

        <main class="pi-app" data-id="piou-app">
      <section class="pi-start" data-id="piou-start-screen" data-tv-screen>
        <div class="pi-card">
          <img
            class="pi-logo"
            src="assets/thumbnail.svg"
            alt=""
            aria-hidden="true"
          />
          <h2 class="pi-start-title" data-i18n="title">Piou</h2>
          <p class="pi-pitch" data-i18n="pitch"></p>
          <button
            type="button"
            class="pi-button pi-resume"
            data-id="piou-resume-button"
            data-tv-focus
            hidden
          >
            <span data-i18n="resume">Reprendre</span>
            <span class="pi-resume-info" data-resume-info></span>
          </button>
          <button
            type="button"
            class="pi-button"
            data-id="piou-play-button"
            data-tv-focus
            data-i18n="play"
          ></button>
          <p class="pi-best" data-id="piou-start-best"></p>
        </div>
      </section>

      <section class="pi-stage" data-id="piou-stage" data-tv-screen hidden>
        <div
          class="pi-play-area"
          data-id="piou-play-area"
          tabindex="0"
          role="button"
          data-tv-focus
          data-tv-keys="up"
          data-i18n-aria="playArea"
        >
          <canvas class="pi-canvas" data-id="piou-canvas"></canvas>
          <p class="pi-score" data-id="piou-score-value" aria-live="polite">
            0
          </p>
          <div class="pi-hint" data-id="piou-hint">
            <p class="pi-hint-title" data-id="piou-hint-title"></p>
            <p class="pi-hint-keys" data-i18n="keysHint"></p>
          </div>
        </div>
        <button
          type="button"
          class="pi-tool"
          data-id="piou-menu-button"
          data-tv-back
          aria-label="Menu"
          data-i18n-aria="menuButton"
        >
          <span aria-hidden="true">❚❚</span>
        </button>
      </section>

      <div class="pi-overlay" data-id="piou-paused" data-tv-overlay hidden>
        <div class="pi-card" role="dialog" aria-modal="true">
          <h2 class="pi-overlay-title" data-i18n="paused">Pause</h2>
          <p data-i18n="pausedText"></p>
          <button
            type="button"
            class="pi-button"
            data-id="piou-continue-button"
            data-tv-focus
            data-tv-back
            data-i18n="continue"
          ></button>
          <button
            type="button"
            class="pi-button pi-button-soft"
            data-id="piou-paused-menu-button"
            data-match-quit
            data-i18n="menu"
          ></button>
        </div>
      </div>

      <div class="pi-overlay" data-id="piou-end" data-tv-overlay hidden>
        <div class="pi-card" role="dialog" aria-modal="true">
          <h2 class="pi-overlay-title" data-i18n="endTitle"></h2>
          <p class="pi-score-line" data-id="piou-end-score"></p>
          <p class="pi-best" data-id="piou-end-best"></p>
          <button
            type="button"
            class="pi-button"
            data-id="piou-replay-button"
            data-tv-focus
            data-i18n="replay"
          ></button>
          <button
            type="button"
            class="pi-button pi-button-soft"
            data-id="piou-end-menu-button"
            data-tv-back
            data-i18n="menu"
          ></button>
        </div>
      </div>
    </main>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
