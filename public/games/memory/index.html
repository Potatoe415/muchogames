<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1e1b4b" />
    <title>Memory</title>
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="play.css" />
    <link rel="stylesheet" href="online.css" />
    <link rel="stylesheet" href="debug.css" />
  </head>
  <body data-match-saved>
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a
          class="back-button"
          href="/"
          data-id="game-back-button"
          aria-label="Retour"
          data-i18n-aria="back"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
        <button
          type="button"
          class="back-button"
          data-id="memory-quit-button"
          data-match-quit
          hidden
          aria-label="Retour"
          data-i18n-aria="back"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" />
          </svg>
        </button>
        <button
          type="button"
          class="back-button"
          data-id="memory-new-button"
          hidden
          aria-label="Nouvelle partie"
          data-i18n-aria="newGameAria"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12a9 9 0 1 1-2.6-6.3" />
            <path d="M21 3v6h-6" />
          </svg>
        </button>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-i18n="title">Memory</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          type="button"
          data-id="game-options-button"
          aria-label="Options"
          data-i18n-aria="options"
          aria-expanded="false"
          aria-controls="optionsPanel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="optionsPanel"
      class="options-panel"
      data-id="game-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div class="options-panel-sheet" role="dialog" aria-modal="true">
        <div class="options-panel-header">
          <span class="options-panel-title" data-i18n="options">Options</span>
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="memory-options-close"
            aria-label="Fermer"
            data-i18n-aria="close"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section" data-id="game-options-language">
            <p class="options-panel-section-title" data-i18n="language">
              Langue
            </p>
            <div class="memory-lang">
              <button
                type="button"
                class="memory-chip"
                data-lang="fr"
                data-id="memory-lang-fr"
              >
                FR
              </button>
              <button
                type="button"
                class="memory-chip"
                data-lang="en"
                data-id="memory-lang-en"
              >
                EN
              </button>
              <button
                type="button"
                class="memory-chip"
                data-lang="es"
                data-id="memory-lang-es"
              >
                ES
              </button>
            </div>
          </div>
          <details class="options-panel-section" data-id="game-options-rules">
            <summary class="options-panel-section-title" data-i18n="rules">
              Règles
            </summary>
            <div class="rules-modal-content" data-id="memory-rules"></div>
          </details>
          <div class="options-panel-section" data-id="game-options-debug">
            <p class="options-panel-section-title" data-i18n="debug">Debug</p>
            <button
              type="button"
              class="memory-chip"
              data-id="memory-debug-toggle"
              data-i18n="debugShow"
              aria-pressed="false"
            >
              Afficher les infos d'affichage
            </button>
          </div>
        </div>
      </div>
    </div>

    <main class="memory-app" data-id="memory-app">
      <section class="memory-setup" data-id="memory-setup">
        <div class="memory-resume" data-id="memory-resume" hidden>
          <button
            type="button"
            class="memory-start"
            data-id="memory-resume-button"
            data-i18n="resume"
            hidden
          >
            Reprendre la partie
          </button>
          <button
            type="button"
            class="memory-start"
            data-id="memory-resume-online-button"
            hidden
          ></button>
        </div>
        <div class="memory-panel memory-setup-panel">
          <div class="memory-setup-column memory-setup-looks">
            <div
              class="memory-choice memory-theme-choice"
              data-id="memory-themes"
            >
              <p class="memory-label" data-i18n="theme"></p>
              <div class="memory-theme-list" data-id="memory-theme-list"></div>
            </div>
            <div class="memory-choice" data-id="memory-backs">
              <p class="memory-label" data-i18n="cardBack"></p>
              <div class="memory-back-list" data-id="memory-back-list"></div>
            </div>
          </div>
          <div class="memory-setup-column memory-setup-rules">
            <div class="memory-choice" data-id="memory-modes">
              <p class="memory-label" data-i18n="who"></p>
              <div class="memory-chips" data-id="memory-mode-list"></div>
            </div>
            <div class="memory-choice" data-id="memory-difficulty" hidden>
              <p class="memory-label" data-i18n="level"></p>
              <div class="memory-chips" data-id="memory-level-list"></div>
            </div>
            <div class="memory-choice" data-id="memory-grids">
              <p class="memory-label" data-i18n="size"></p>
              <div class="memory-chips" data-id="memory-grid-list"></div>
            </div>
            <button
              type="button"
              class="memory-start"
              data-id="memory-start-button"
              data-i18n="start"
            >
              Jouer
            </button>
            <div class="memory-choice" data-id="memory-online" hidden>
              <p class="memory-label" data-i18n="joinLabel"></p>
              <div class="memory-join">
                <input
                  class="memory-code-input"
                  data-id="memory-join-input"
                  type="text"
                  inputmode="text"
                  autocomplete="off"
                  autocapitalize="characters"
                  spellcheck="false"
                  maxlength="3"
                  aria-label="Code"
                  data-i18n-aria="roomCode"
                />
                <button
                  type="button"
                  class="memory-text memory-text-ghost"
                  data-id="memory-join-button"
                  data-i18n="join"
                >
                  Rejoindre
                </button>
              </div>
            </div>
            <p
              class="memory-error"
              data-id="memory-online-error"
              role="alert"
              hidden
            ></p>
          </div>
        </div>
      </section>

      <section class="memory-wait" data-id="memory-wait" hidden>
        <div class="memory-panel memory-wait-card">
          <p class="memory-label" data-i18n="roomCode"></p>
          <p class="memory-code" data-id="memory-wait-code"></p>
          <p data-id="memory-wait-status" aria-live="polite"></p>
          <button
            type="button"
            class="memory-start"
            data-id="memory-share-button"
            data-i18n="share"
            hidden
          >
            Partager le lien
          </button>
          <p class="memory-note" data-id="memory-wait-note" hidden></p>
          <button
            type="button"
            class="memory-text memory-text-ghost"
            data-id="memory-cancel-button"
            data-i18n="cancel"
          >
            Annuler
          </button>
        </div>
      </section>

      <section class="memory-play" data-id="memory-play" data-active="0" hidden>
        <div
          class="memory-bar memory-bar-top"
          data-id="memory-player-two"
          data-active="false"
        >
          <span class="memory-who">
            <span class="memory-name" data-id="memory-p2-name"></span>
            <strong class="memory-score" data-id="memory-p2-score"></strong>
          </span>
        </div>
        <p
          class="memory-away"
          data-id="memory-away-banner"
          data-i18n="away"
          role="status"
          hidden
        ></p>
        <div class="memory-stage" data-id="memory-stage">
          <div class="memory-board" data-id="memory-board"></div>
        </div>
        <div
          class="memory-bar memory-bar-bottom"
          data-id="memory-player-one"
          data-active="true"
        >
          <span class="memory-who">
            <span class="memory-name" data-id="memory-p1-name"></span>
            <strong class="memory-score" data-id="memory-p1-score"></strong>
          </span>
          <button
            type="button"
            class="memory-icon"
            data-id="memory-mute-button"
            aria-pressed="false"
          >
            <svg
              class="memory-icon-on"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path fill="currentColor" d="M4 10h4l5-4v12l-5-4H4z" />
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                d="M16 9a4 4 0 0 1 0 6"
              />
            </svg>
            <svg
              class="memory-icon-off"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path fill="currentColor" d="M4 10h4l5-4v12l-5-4H4z" />
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                d="M16 10l5 5M21 10l-5 5"
              />
            </svg>
          </button>
        </div>
        <div class="memory-end" data-id="memory-end" hidden>
          <div class="memory-end-card">
            <h2 data-id="memory-end-title"></h2>
            <p data-id="memory-end-line"></p>
            <p class="memory-end-detail" data-id="memory-end-detail" hidden></p>
            <div class="memory-actions">
              <button
                type="button"
                class="memory-text"
                data-id="memory-replay-button"
                data-i18n="replay"
              >
                Rejouer
              </button>
              <button
                type="button"
                class="memory-text memory-text-ghost"
                data-id="memory-setup-button"
                data-i18n="changeSetup"
              >
                Changer
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script src="/shared/js/player-profile.js"></script>
    <script src="/shared/js/online-room.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
