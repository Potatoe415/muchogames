<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14213d" />
    <title>4 en ligne</title>
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="board.css" />
    <script src="/shared/js/tv-remote.js"></script>
  </head>
  <body data-match-saved>
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a
          class="back-button"
          href="/"
          data-id="game-back-button"
          data-tv-back
          aria-label="Retour"
          data-i18n-aria="back"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
        <button
          type="button"
          class="back-button"
          data-id="connectfour-quit-button"
          data-match-quit
          data-tv-back
          aria-label="Quitter la partie"
          data-i18n-aria="quit"
          hidden
        >
          <span aria-hidden="true">✕</span>
        </button>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-i18n="title">4 en ligne</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          type="button"
          data-id="game-options-button"
          aria-label="Options"
          data-i18n-aria="options"
          aria-expanded="false"
          aria-controls="optionsPanel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="optionsPanel"
      class="options-panel"
      data-id="game-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div class="options-panel-sheet" role="dialog" aria-modal="true">
        <div class="options-panel-header">
          <span class="options-panel-title" data-i18n="options">Options</span>
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="connectfour-options-close"
            aria-label="Fermer"
            data-i18n-aria="close"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section" data-id="game-options-language">
            <p class="options-panel-section-title" data-i18n="language">
              Langue
            </p>
            <div class="lang-selector">
              <button
                type="button"
                class="lang-btn"
                data-lang="fr"
                data-id="connectfour-lang-fr"
              >
                FR
              </button>
              <button
                type="button"
                class="lang-btn"
                data-lang="en"
                data-id="connectfour-lang-en"
              >
                EN
              </button>
              <button
                type="button"
                class="lang-btn"
                data-lang="es"
                data-id="connectfour-lang-es"
              >
                ES
              </button>
            </div>
          </div>
          <details class="options-panel-section" data-id="game-options-rules">
            <summary class="options-panel-section-title" data-i18n="rules">
              Règles
            </summary>
            <div
              class="rules-modal-content"
              data-id="connectfour-rules-content"
            ></div>
          </details>
        </div>
      </div>
    </div>

    <main class="game-shell" data-id="connectfour-shell">
      <section
        class="game-screen"
        data-id="connectfour-dashboard-screen"
        data-tv-screen
      >
        <div class="game-card">
          <p class="c4-logo" aria-hidden="true">
            <span data-disc="red"></span><span data-disc="yellow"></span
            ><span data-disc="red"></span><span data-disc="yellow"></span>
          </p>
          <h2 class="game-title" data-i18n="title">4 en ligne</h2>
          <p class="c4-pitch" data-i18n="pitch"></p>
          <div
            class="c4-modes"
            role="group"
            data-id="connectfour-mode-selector"
            aria-label="Mode de jeu"
            data-i18n-aria="mode"
          >
            <button
              type="button"
              class="c4-mode"
              data-mode="pvp"
              data-id="connectfour-mode-pvp"
              data-i18n="modePvp"
            >
              Joueur contre joueur
            </button>
            <button
              type="button"
              class="c4-mode"
              data-mode="easy"
              data-id="connectfour-mode-bot-easy"
              data-i18n="modeEasy"
            >
              Bot facile
            </button>
            <button
              type="button"
              class="c4-mode"
              data-mode="normal"
              data-id="connectfour-mode-bot-normal"
              data-i18n="modeNormal"
            >
              Bot normal
            </button>
          </div>
          <p class="c4-players" data-id="connectfour-players"></p>
          <button
            type="button"
            class="game-button c4-resume"
            data-id="connectfour-resume-button"
            data-tv-focus
            hidden
          >
            <span data-i18n="resume">Reprendre</span>
            <span class="c4-resume-info" data-resume-info></span>
          </button>
          <button
            type="button"
            class="game-button"
            data-id="connectfour-start-button"
            data-tv-focus
            data-i18n="newGame"
          >
            Nouvelle partie
          </button>
        </div>
      </section>

      <section
        class="game-screen c4-play"
        data-id="connectfour-play-screen"
        data-tv-screen
        hidden
      >
        <div class="c4-side" data-id="connectfour-hud">
          <p class="c4-mode-label" data-id="connectfour-mode-label"></p>
          <p class="c4-status-row">
            <span
              class="c4-turn-disc"
              data-id="connectfour-turn-disc"
              aria-hidden="true"
            ></span>
            <span
              class="c4-status"
              data-id="connectfour-status"
              role="status"
              aria-live="polite"
            ></span>
          </p>
          <div
            class="c4-end"
            data-id="connectfour-end-panel"
            data-tv-screen
            hidden
          >
            <button
              type="button"
              class="game-button"
              data-id="connectfour-replay-button"
              data-tv-focus
              data-i18n="replay"
            >
              Rejouer
            </button>
            <button
              type="button"
              class="game-button c4-button-soft"
              data-id="connectfour-menu-button"
              data-tv-back
              data-i18n="menu"
            >
              Menu du jeu
            </button>
          </div>
        </div>
        <div class="c4-board-area" data-id="connectfour-board-area">
          <div
            class="c4-board"
            data-id="connectfour-board"
            role="group"
            aria-label="Grille"
            data-i18n-aria="board"
          ></div>
        </div>
      </section>
    </main>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
