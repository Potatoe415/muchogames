<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1320" />
    <title>JezzBall</title>
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a
          class="back-button"
          href="/"
          data-id="game-back-button"
          aria-label="Retour"
          data-i18n-aria="back"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-i18n="title">JezzBall</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          type="button"
          data-id="game-options-button"
          aria-label="Options"
          data-i18n-aria="options"
          aria-expanded="false"
          aria-controls="optionsPanel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="optionsPanel"
      class="options-panel"
      data-id="game-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div class="options-panel-sheet" role="dialog" aria-modal="true">
        <div class="options-panel-header">
          <span class="options-panel-title" data-i18n="options">Options</span>
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="jezzball-options-close"
            aria-label="Fermer"
            data-i18n-aria="close"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section" data-id="game-options-language">
            <p class="options-panel-section-title" data-i18n="language">
              Langue
            </p>
            <div class="jb-lang-switch">
              <button
                type="button"
                class="jb-chip"
                data-lang="fr"
                data-id="jezzball-lang-fr"
              >
                FR
              </button>
              <button
                type="button"
                class="jb-chip"
                data-lang="en"
                data-id="jezzball-lang-en"
              >
                EN
              </button>
              <button
                type="button"
                class="jb-chip"
                data-lang="es"
                data-id="jezzball-lang-es"
              >
                ES
              </button>
            </div>
          </div>
          <div class="options-panel-section" data-id="game-options-rules">
            <p class="options-panel-section-title" data-i18n="rules">Règles</p>
            <div
              class="rules-modal-content"
              data-id="jezzball-rules-content"
            ></div>
          </div>
          <div class="options-panel-section" data-id="jezzball-options-sound">
            <p class="options-panel-section-title" data-i18n="sound">Son</p>
            <button
              type="button"
              class="jb-chip"
              data-id="jezzball-sound-toggle"
              aria-pressed="true"
            ></button>
          </div>
          <div
            class="options-panel-section"
            data-id="jezzball-options-double-tap"
          >
            <p class="options-panel-section-title" data-i18n="doubleTap">
              Double tap
            </p>
            <p class="jb-option-hint" data-i18n="doubleTapHint"></p>
            <button
              type="button"
              class="jb-chip"
              data-id="jezzball-double-tap-toggle"
              aria-pressed="false"
            ></button>
          </div>
        </div>
      </div>
    </div>

    <main class="jb-app" data-id="jezzball-app">
      <section class="jb-start" data-id="jezzball-start-screen">
        <div class="jb-card">
          <h2 class="jb-logo" data-i18n="title">JezzBall</h2>
          <p class="jb-pitch" data-i18n="pitch"></p>
          <p class="jb-best" data-id="jezzball-start-best"></p>
          <button
            type="button"
            class="jb-button"
            data-id="jezzball-start-button"
            data-i18n="play"
          >
            Jouer
          </button>
        </div>
      </section>

      <section class="jb-stage" data-id="jezzball-stage" hidden>
        <div class="jb-board" data-id="jezzball-board">
          <canvas
            class="jb-canvas"
            data-id="jezzball-canvas"
            data-axis="h"
            role="img"
            data-i18n-aria="canvas"
          ></canvas>
        </div>
        <div class="jb-hud" data-id="jezzball-hud">
          <div class="jb-stat" data-id="jezzball-hud-level">
            <span class="jb-stat-label" data-i18n="level">Niveau</span>
            <span class="jb-stat-value" data-hud="level">1</span>
          </div>
          <div class="jb-stat" data-id="jezzball-hud-lives">
            <span class="jb-stat-label" data-i18n="lives">Vies</span>
            <span class="jb-stat-value" data-hud="lives">2</span>
          </div>
          <div class="jb-stat jb-stat-wide" data-id="jezzball-hud-area">
            <span class="jb-stat-label" data-i18n="area">Surface</span>
            <span class="jb-stat-value" data-hud="area">0% / 75%</span>
          </div>
          <div class="jb-stat" data-id="jezzball-hud-time">
            <span class="jb-stat-label" data-i18n="time">Temps</span>
            <span class="jb-stat-value" data-hud="time">0</span>
          </div>
          <div class="jb-stat" data-id="jezzball-hud-score">
            <span class="jb-stat-label" data-i18n="score">Score</span>
            <span class="jb-stat-value" data-hud="score">0</span>
          </div>
          <div class="jb-stat jb-stat-wide" data-id="jezzball-hud-best">
            <span class="jb-stat-label" data-i18n="bestShort">Record</span>
            <span class="jb-stat-value" data-hud="best">0</span>
          </div>
          <button
            type="button"
            class="jb-axis"
            data-id="jezzball-axis-button"
            data-axis="h"
            aria-pressed="false"
            aria-label="Changer d'axe"
            data-i18n-aria="axisHint"
          >
            <span class="jb-axis-icon jb-axis-h" aria-hidden="true">↔</span>
            <span class="jb-axis-icon jb-axis-v" aria-hidden="true">↕</span>
            <span class="jb-axis-label jb-axis-h" data-i18n="horizontal"
              >Horizontal</span
            >
            <span class="jb-axis-label jb-axis-v" data-i18n="vertical"
              >Vertical</span
            >
          </button>
        </div>

        <div class="jb-overlay" data-id="jezzball-level-cleared" hidden>
          <div class="jb-card">
            <h2 class="jb-overlay-title" data-id="jezzball-cleared-title"></h2>
            <p data-id="jezzball-cleared-area"></p>
            <p data-id="jezzball-cleared-percent"></p>
            <p data-id="jezzball-cleared-time"></p>
            <p class="jb-score-line" data-id="jezzball-cleared-score"></p>
            <button
              type="button"
              class="jb-button"
              data-id="jezzball-next-level-button"
              data-i18n="next"
            ></button>
          </div>
        </div>

        <div class="jb-overlay" data-id="jezzball-game-over" hidden>
          <div class="jb-card">
            <h2 class="jb-overlay-title" data-i18n="gameOver"></h2>
            <p data-id="jezzball-over-reason"></p>
            <p data-id="jezzball-over-stats"></p>
            <p class="jb-score-line" data-id="jezzball-over-score"></p>
            <p class="jb-best" data-id="jezzball-over-best"></p>
            <button
              type="button"
              class="jb-button"
              data-id="jezzball-replay-button"
              data-i18n="replay"
            ></button>
          </div>
        </div>

        <div class="jb-overlay" data-id="jezzball-paused" hidden>
          <div class="jb-card">
            <h2 class="jb-overlay-title" data-i18n="paused"></h2>
            <button
              type="button"
              class="jb-button"
              data-id="jezzball-resume-button"
              data-i18n="resume"
            ></button>
          </div>
        </div>
      </section>
    </main>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
