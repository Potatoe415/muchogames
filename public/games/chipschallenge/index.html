<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c0c0c0" />
    <title>Chip's Challenge</title>
    <link rel="preload" href="assets/tiles.png" as="image" />
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="win31.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a
          class="back-button"
          href="/"
          data-id="game-back-button"
          aria-label="Retour"
          data-i18n-aria="back"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-i18n="title">Chip's Challenge</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          type="button"
          data-id="game-options-button"
          aria-label="Options"
          data-i18n-aria="options"
          aria-expanded="false"
          aria-controls="optionsPanel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="optionsPanel"
      class="options-panel"
      data-id="game-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div class="options-panel-sheet" role="dialog" aria-modal="true">
        <div class="options-panel-header">
          <span class="options-panel-title" data-i18n="options">Options</span>
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="chips-options-close"
            aria-label="Fermer"
            data-i18n-aria="close"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section" data-id="game-options-language">
            <p class="options-panel-section-title" data-i18n="language">
              Langue
            </p>
            <div class="cc-lang-switch">
              <button
                type="button"
                class="cc-chip"
                data-lang="fr"
                data-id="chips-lang-fr"
              >
                FR
              </button>
              <button
                type="button"
                class="cc-chip"
                data-lang="en"
                data-id="chips-lang-en"
              >
                EN
              </button>
              <button
                type="button"
                class="cc-chip"
                data-lang="es"
                data-id="chips-lang-es"
              >
                ES
              </button>
            </div>
          </div>
          <div class="options-panel-section" data-id="chips-options-sound">
            <p class="options-panel-section-title" data-i18n="sound">Son</p>
            <button
              type="button"
              class="cc-chip"
              data-id="chips-sound-toggle"
              aria-pressed="true"
            ></button>
          </div>
          <div class="options-panel-section" data-id="game-options-rules">
            <p class="options-panel-section-title" data-i18n="rules">Règles</p>
            <div
              class="rules-modal-content"
              data-id="chips-rules-content"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <main class="cc-app" data-id="chips-app">
      <section class="cc-start" data-id="chips-start-screen">
        <div class="cc-window" data-id="chips-start-window">
          <div class="cc-titlebar" data-i18n="title">Chip's Challenge</div>
          <div class="cc-window-body">
            <div class="cc-logo" aria-hidden="true">
              <span class="cc-logo-tile cc-logo-chip"></span>
              <span class="cc-logo-tile cc-logo-ic"></span>
              <span class="cc-logo-tile cc-logo-exit"></span>
            </div>
            <p class="cc-pitch" data-i18n="pitch"></p>
            <p class="cc-section-title" data-i18n="levelsTitle">
              Choisir un niveau
            </p>
            <ol class="cc-levels" data-id="chips-level-list"></ol>
            <p
              class="cc-error"
              data-id="chips-levels-error"
              data-i18n="levelsError"
              role="alert"
              hidden
            ></p>
            <p class="cc-total" data-id="chips-total-score"></p>
            <form
              class="cc-password"
              data-id="chips-password-form"
              autocomplete="off"
            >
              <label
                for="ccPassword"
                data-i18n="passwordLabel"
                data-id="chips-password-label"
                >Mot de passe</label
              >
              <input
                id="ccPassword"
                class="cc-input"
                data-id="chips-password-input"
                maxlength="4"
                autocapitalize="characters"
                spellcheck="false"
                inputmode="text"
              />
              <button
                type="submit"
                class="cc-btn"
                data-id="chips-password-submit"
                data-i18n="go"
              >
                OK
              </button>
            </form>
            <p
              class="cc-error"
              data-id="chips-password-error"
              data-i18n="passwordError"
              role="alert"
              hidden
            ></p>
          </div>
        </div>
      </section>

      <section class="cc-stage" data-id="chips-stage" hidden>
        <div class="cc-board-host" data-id="chips-board-host">
          <div class="cc-board-frame" data-id="chips-board-frame">
            <canvas
              class="cc-board"
              data-id="chips-board"
              role="img"
              data-i18n-aria="board"
            ></canvas>
            <div class="cc-title-card" data-id="chips-title-card">
              <span data-id="chips-title-level"></span>
              <span data-id="chips-title-password"></span>
            </div>
          </div>
        </div>

        <aside class="cc-side" data-id="chips-side">
          <div class="cc-panel" data-id="chips-panel">
            <div class="cc-counters" data-counters>
              <div class="cc-counter" data-id="chips-counter-level">
                <span class="cc-counter-label" data-i18n="levelLabel"
                  >NIVEAU</span
                >
                <canvas class="cc-led" data-led="level"></canvas>
              </div>
              <div class="cc-counter" data-id="chips-counter-time">
                <span class="cc-counter-label" data-i18n="timeLabel"
                  >TEMPS</span
                >
                <canvas class="cc-led" data-led="time"></canvas>
              </div>
              <div class="cc-counter" data-id="chips-counter-chips">
                <span class="cc-counter-label" data-i18n="chipsLabel"
                  >PUCES</span
                >
                <canvas class="cc-led" data-led="chips"></canvas>
              </div>
            </div>
            <div class="cc-hint" data-id="chips-hint-box" data-hint-box hidden>
              <p class="cc-hint-title" data-i18n="hintTitle">Indice</p>
              <p class="cc-hint-text" data-hint-text></p>
            </div>
            <canvas
              class="cc-inventory"
              data-id="chips-inventory"
              data-inventory
              role="img"
              data-i18n-aria="inventory"
            ></canvas>
          </div>

          <div class="cc-controls" data-id="chips-controls">
            <div class="cc-pad" data-id="chips-dpad">
              <button
                type="button"
                class="cc-pad-btn cc-pad-up"
                data-pad="up"
                data-id="chips-pad-up"
                data-i18n-aria="up"
              >
                <span class="cc-arrow"></span>
              </button>
              <button
                type="button"
                class="cc-pad-btn cc-pad-left"
                data-pad="left"
                data-id="chips-pad-left"
                data-i18n-aria="left"
              >
                <span class="cc-arrow"></span>
              </button>
              <span class="cc-pad-center" aria-hidden="true"></span>
              <button
                type="button"
                class="cc-pad-btn cc-pad-right"
                data-pad="right"
                data-id="chips-pad-right"
                data-i18n-aria="right"
              >
                <span class="cc-arrow"></span>
              </button>
              <button
                type="button"
                class="cc-pad-btn cc-pad-down"
                data-pad="down"
                data-id="chips-pad-down"
                data-i18n-aria="down"
              >
                <span class="cc-arrow"></span>
              </button>
            </div>
            <div class="cc-actions" data-id="chips-actions">
              <button
                type="button"
                class="cc-btn"
                data-id="chips-restart-button"
                data-i18n="restart"
              >
                Recommencer (R)
              </button>
              <button
                type="button"
                class="cc-btn"
                data-id="chips-levels-button"
                data-i18n="levels"
              >
                Niveaux
              </button>
              <button
                type="button"
                class="cc-btn"
                data-id="chips-pause-button"
                data-i18n="pause"
              >
                Pause (P)
              </button>
            </div>
          </div>
        </aside>

        <div class="cc-overlay" data-id="chips-paused" hidden>
          <div class="cc-window cc-dialog">
            <div class="cc-titlebar" data-i18n="title">Chip's Challenge</div>
            <div class="cc-window-body">
              <p class="cc-dialog-title" data-i18n="paused">Pause</p>
              <button
                type="button"
                class="cc-btn cc-btn-default"
                data-id="chips-resume-button"
                data-i18n="resume"
              >
                Reprendre
              </button>
            </div>
          </div>
        </div>

        <div class="cc-overlay" data-id="chips-death" hidden>
          <div class="cc-window cc-dialog" role="alertdialog">
            <div class="cc-titlebar" data-i18n="title">Chip's Challenge</div>
            <div class="cc-window-body">
              <p class="cc-dialog-title" data-i18n="deathTitle">Oups !</p>
              <p data-id="chips-death-text"></p>
              <button
                type="button"
                class="cc-btn cc-btn-default"
                data-id="chips-retry-button"
                data-i18n="retry"
              >
                Réessayer
              </button>
            </div>
          </div>
        </div>

        <div class="cc-overlay" data-id="chips-win" hidden>
          <div class="cc-window cc-dialog" role="alertdialog">
            <div class="cc-titlebar" data-i18n="title">Chip's Challenge</div>
            <div class="cc-window-body">
              <p class="cc-dialog-title" data-i18n="winTitle"></p>
              <ul class="cc-win-lines" data-id="chips-win-lines"></ul>
              <div class="cc-dialog-buttons">
                <button
                  type="button"
                  class="cc-btn cc-btn-default"
                  data-id="chips-next-button"
                  data-i18n="next"
                >
                  Niveau suivant
                </button>
                <button
                  type="button"
                  class="cc-btn"
                  data-id="chips-win-levels-button"
                  data-i18n="levels"
                >
                  Niveaux
                </button>
              </div>
            </div>
          </div>
        </div>

        <p
          class="cc-window cc-load-error"
          data-id="chips-load-error"
          data-i18n="loadError"
          role="alert"
          hidden
        ></p>
      </section>
    </main>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
