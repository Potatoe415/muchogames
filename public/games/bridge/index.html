<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f3d2a" />
    <title>Bridge</title>
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="slider.css" />
    <link rel="stylesheet" href="table.css" />
    <link rel="stylesheet" href="cards.css" />
    <link rel="stylesheet" href="bidding.css" />
    <link rel="stylesheet" href="panels.css" />
  </head>
  <body>
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a
          class="back-button"
          href="/"
          data-id="game-back-button"
          aria-label="Retour"
          data-i18n-aria="back"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-i18n="title">Bridge</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          type="button"
          data-id="game-options-button"
          aria-label="Options"
          data-i18n-aria="options"
          aria-expanded="false"
          aria-controls="optionsPanel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="optionsPanel"
      class="options-panel"
      data-id="game-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div class="options-panel-sheet" role="dialog" aria-modal="true">
        <div class="options-panel-header">
          <span class="options-panel-title" data-i18n="options">Options</span>
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="bridge-options-close"
            aria-label="Fermer"
            data-i18n-aria="close"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section" data-id="game-options-language">
            <p class="options-panel-section-title" data-i18n="language">
              Langue
            </p>
            <div class="br-chips">
              <button
                type="button"
                class="br-chip"
                data-lang="fr"
                data-id="bridge-lang-fr"
              >
                FR
              </button>
              <button
                type="button"
                class="br-chip"
                data-lang="en"
                data-id="bridge-lang-en"
              >
                EN
              </button>
              <button
                type="button"
                class="br-chip"
                data-lang="es"
                data-id="bridge-lang-es"
              >
                ES
              </button>
            </div>
          </div>
          <div data-id="bridge-options-settings"></div>
          <div class="options-panel-section" data-id="game-options-rules">
            <p class="options-panel-section-title" data-i18n="rules">Règles</p>
            <div
              class="rules-modal-content"
              data-id="bridge-rules-content"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <main class="br-app" data-id="bridge-app" data-deck="two">
      <section class="br-start" data-id="bridge-start-screen">
        <div class="br-card">
          <div class="br-logo" aria-hidden="true">
            <span class="suit-3">♠</span><span class="suit-2">♥</span
            ><span class="suit-1">♦</span><span class="suit-0">♣</span>
          </div>
          <h2 class="br-title" data-i18n="title">Bridge</h2>
          <p class="br-pitch" data-i18n="pitch"></p>
          <button
            type="button"
            class="br-button br-button-resume"
            data-id="bridge-resume-button"
            data-i18n="resume"
            hidden
          ></button>
          <div class="br-field" data-id="bridge-level-field">
            <p class="br-label" data-i18n="level"></p>
            <div class="br-slider" data-level="medium">
              <input
                type="range"
                class="br-range"
                min="0"
                max="3"
                step="1"
                data-id="bridge-level-slider"
                aria-label="Niveau"
                data-i18n-aria="level"
              />
              <div class="br-ticks">
                <button
                  type="button"
                  class="br-tick"
                  data-setting="level"
                  data-value="easy"
                  data-id="bridge-level-easy"
                  data-i18n="easy"
                ></button>
                <button
                  type="button"
                  class="br-tick"
                  data-setting="level"
                  data-value="medium"
                  data-id="bridge-level-medium"
                  data-i18n="medium"
                ></button>
                <button
                  type="button"
                  class="br-tick"
                  data-setting="level"
                  data-value="hard"
                  data-id="bridge-level-hard"
                  data-i18n="hard"
                ></button>
                <button
                  type="button"
                  class="br-tick"
                  data-setting="level"
                  data-value="expert"
                  data-id="bridge-level-expert"
                  data-i18n="expert"
                ></button>
              </div>
            </div>
            <p class="br-level-record" data-id="bridge-level-record"></p>
          </div>
          <ul class="br-facts" data-id="bridge-facts">
            <li data-i18n="factSystem"></li>
            <li data-i18n="factFormat"></li>
            <li data-i18n="factSeat"></li>
          </ul>
          <button
            type="button"
            class="br-button"
            data-id="bridge-play-button"
            data-i18n="play"
          ></button>
        </div>
      </section>

      <section class="br-stage" data-id="bridge-stage" hidden>
        <div class="br-status" data-id="bridge-status">
          <span class="br-status-deal" data-id="bridge-status-deal"></span>
          <button
            type="button"
            class="br-status-contract"
            data-id="bridge-status-contract"
          ></button>
          <span class="br-status-tricks" data-id="bridge-status-tricks"></span>
        </div>

        <div
          class="br-table"
          data-id="bridge-table"
          role="group"
          aria-label="Table"
          data-i18n-aria="table"
        >
          <div
            class="br-seat br-seat-north"
            data-seat="0"
            data-id="bridge-seat-north"
          >
            <div class="br-tag" data-seat-tag></div>
            <div class="br-hand" data-seat-hand></div>
          </div>
          <div
            class="br-seat br-seat-west"
            data-seat="3"
            data-id="bridge-seat-west"
          >
            <div class="br-tag" data-seat-tag></div>
            <div class="br-hand" data-seat-hand></div>
          </div>
          <div class="br-center" data-id="bridge-center">
            <div class="br-auction" data-id="bridge-auction"></div>
            <div
              class="br-trick"
              data-id="bridge-trick"
              aria-label="Pli"
              data-i18n-aria="trick"
            >
              <div class="br-slot" data-slot="0"></div>
              <div class="br-slot" data-slot="1"></div>
              <div class="br-slot" data-slot="2"></div>
              <div class="br-slot" data-slot="3"></div>
            </div>
          </div>
          <div
            class="br-seat br-seat-east"
            data-seat="1"
            data-id="bridge-seat-east"
          >
            <div class="br-tag" data-seat-tag></div>
            <div class="br-hand" data-seat-hand></div>
          </div>
          <div
            class="br-seat br-seat-south"
            data-seat="2"
            data-id="bridge-seat-south"
          >
            <div class="br-tag" data-seat-tag></div>
            <div class="br-hand" data-seat-hand></div>
          </div>
        </div>

        <p class="br-message" data-id="bridge-message" aria-live="polite"></p>

        <div
          class="br-bidbox"
          data-id="bridge-bidding-box"
          role="group"
          aria-label="Enchères"
          data-i18n-aria="biddingBox"
          hidden
        >
          <div class="br-bid-row" data-id="bridge-bid-levels"></div>
          <div class="br-bid-row" data-id="bridge-bid-strains"></div>
          <div class="br-bid-row br-bid-calls">
            <button
              type="button"
              class="br-call br-call-pass"
              data-call="P"
              data-id="bridge-bid-pass"
              data-i18n="pass"
            ></button>
            <button
              type="button"
              class="br-call br-call-double"
              data-call="X"
              data-id="bridge-bid-double"
              data-i18n="double"
            ></button>
            <button
              type="button"
              class="br-call br-call-redouble"
              data-call="XX"
              data-id="bridge-bid-redouble"
              data-i18n="redouble"
            ></button>
          </div>
        </div>

        <div class="br-actions" data-id="bridge-actions">
          <button type="button" class="br-action" data-id="bridge-undo-button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 14 4 9l5-5" />
              <path d="M4 9h11a5 5 0 0 1 0 10h-3" />
            </svg>
            <span data-i18n="undo"></span>
          </button>
          <button
            type="button"
            class="br-action"
            data-id="bridge-hint-button"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 18h6M10 22h4" />
              <path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z" />
            </svg>
            <span data-i18n="hint"></span>
          </button>
          <button
            type="button"
            class="br-action"
            data-id="bridge-last-trick-button"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="6" width="10" height="14" rx="2" />
              <path d="M9 3h9a2 2 0 0 1 2 2v12" />
            </svg>
            <span data-i18n="lastTrick"></span>
          </button>
          <button type="button" class="br-action" data-id="bridge-score-button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 3h14v18H5z" />
              <path d="M9 8h6M9 12h6M9 16h4" />
            </svg>
            <span data-i18n="score"></span>
          </button>
          <button
            type="button"
            class="br-action"
            data-id="bridge-claim-button"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 13l4 4L19 7" />
            </svg>
            <span data-i18n="claim"></span>
          </button>
          <button
            type="button"
            class="br-action"
            data-id="bridge-quit-button"
            data-match-quit
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
            <span data-i18n="quit"></span>
          </button>
        </div>

        <div class="br-overlay" data-id="bridge-deal-result" hidden>
          <div class="br-card br-panel">
            <h2 class="br-panel-title" data-id="bridge-result-title"></h2>
            <p class="br-panel-line" data-id="bridge-result-line"></p>
            <p class="br-panel-points" data-id="bridge-result-points"></p>
            <div class="br-panel-actions">
              <button
                type="button"
                class="br-button"
                data-id="bridge-next-deal-button"
                data-i18n="nextDeal"
              ></button>
              <button
                type="button"
                class="br-button br-button-ghost"
                data-id="bridge-see-hands-button"
                data-i18n="seeHands"
              ></button>
              <button
                type="button"
                class="br-link"
                data-id="bridge-result-score-button"
                data-i18n="score"
              ></button>
            </div>
          </div>
        </div>

        <div class="br-overlay" data-id="bridge-hands-panel" hidden>
          <div class="br-card br-panel br-panel-wide">
            <h2 class="br-panel-title" data-i18n="allHands"></h2>
            <p class="br-panel-line" data-id="bridge-hands-contract"></p>
            <div class="br-diagram" data-id="bridge-hands-diagram"></div>
            <button
              type="button"
              class="br-button br-button-ghost"
              data-id="bridge-hands-close"
              data-i18n="close"
            ></button>
          </div>
        </div>

        <div class="br-overlay" data-id="bridge-score-panel" hidden>
          <div class="br-card br-panel br-panel-wide">
            <h2 class="br-panel-title" data-i18n="scoreTitle"></h2>
            <div class="br-score" data-id="bridge-score-table"></div>
            <button
              type="button"
              class="br-button br-button-ghost"
              data-id="bridge-score-close"
              data-i18n="close"
            ></button>
          </div>
        </div>

        <div class="br-overlay" data-id="bridge-match-end" hidden>
          <div class="br-card br-panel br-panel-wide">
            <h2 class="br-panel-title" data-id="bridge-match-title"></h2>
            <p class="br-panel-line" data-id="bridge-match-line"></p>
            <div class="br-score" data-id="bridge-match-score"></div>
            <div class="br-panel-actions">
              <button
                type="button"
                class="br-button"
                data-id="bridge-replay-button"
                data-i18n="replay"
              ></button>
              <button
                type="button"
                class="br-button br-button-ghost"
                data-id="bridge-change-settings-button"
                data-i18n="changeSettings"
              ></button>
              <button
                type="button"
                class="br-link"
                data-id="bridge-match-hands-button"
                data-i18n="seeHands"
              ></button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
