<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jeu de mains</title>
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/game-header.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./play.css">
  <script src="/shared/js/tv-remote.js"></script>
</head>
<body class="game-body" data-match-saved>
  <header class="game-nav">
    <div class="nav-side nav-left">
      <!-- Game Dashboard: back to the hub. Hidden during a match. -->
      <a href="../../index.html" class="back-button" data-id="game-back-button" data-tv-back aria-label="Retour" data-i18n-aria="back"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></a>
      <!-- In a match: back to the Game Dashboard, after game-session.js asks. -->
      <button id="btn-quit" class="back-button" type="button" data-id="olemains-quit-match-button" data-match-quit data-tv-back aria-label="Quitter la partie" data-i18n-aria="quit" hidden><span aria-hidden="true">✖</span></button>
    </div>
    <div class="nav-center">
      <img src="./assets/thumbnail.jpg" alt="Jeu de mains" class="nav-banner" data-id="olemains-banner" onerror="this.style.display='none'">
    </div>
    <div class="nav-side nav-right">
      <button
        id="olemains-options-button"
        class="options-button"
        type="button"
        data-id="game-options-button"
        aria-label="Options"
        data-i18n-aria="options"
        aria-expanded="false"
        aria-controls="olemains-options-panel"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </div>
  </header>

  <div id="olemains-options-panel" class="options-panel" data-id="game-options-panel" hidden>
    <div class="options-panel-backdrop" data-options-close></div>
    <div class="options-panel-sheet" role="dialog" aria-modal="true" aria-label="Options" data-i18n-aria="options">
      <div class="options-panel-header">
        <span class="options-panel-title" data-i18n="options">Options</span>
        <button type="button" class="options-panel-close" data-options-close data-id="olemains-options-close" aria-label="Fermer" data-i18n-aria="close">×</button>
      </div>
      <div class="options-panel-body">
        <div class="options-panel-section" data-id="game-options-language">
          <p class="options-panel-section-title" data-i18n="language">Langue</p>
          <div class="lang-selector" role="group" aria-label="Langue" data-i18n-aria="language">
            <button type="button" class="lang-btn" data-lang="fr" data-id="olemains-lang-fr" aria-label="Français">🇫🇷</button>
            <button type="button" class="lang-btn" data-lang="en" data-id="olemains-lang-en" aria-label="English">🇬🇧</button>
            <button type="button" class="lang-btn" data-lang="es" data-id="olemains-lang-es" aria-label="Español">🇪🇸</button>
          </div>
        </div>
        <details id="olemains-rules-section" class="options-panel-section" data-id="game-options-rules">
          <summary class="options-panel-section-title" data-i18n="rules">Règles</summary>
          <div id="olemains-rules-content" class="rules-modal-content" data-id="olemains-rules-content"></div>
        </details>
      </div>
    </div>
  </div>

  <main class="om-shell" data-id="olemains-shell">
    <section id="setup-view" class="om-screen" data-id="olemains-dashboard-screen" data-tv-screen>
      <div class="om-dashboard">
        <div class="om-dashboard-head">
          <h1 class="om-title" data-id="olemains-title" data-i18n="title">Jeu de mains</h1>
          <button id="olemains-resume-button" class="om-button om-resume" type="button" data-id="olemains-resume-button" data-tv-focus hidden>
            <span class="resume-title" data-resume-title>Reprendre</span>
            <span class="resume-info" data-id="olemains-resume-info" data-resume-info></span>
          </button>
        </div>
        <div class="om-dashboard-options">
          <div class="om-field" data-id="olemains-timer-field">
            <label for="timer-input" class="om-label" data-i18n="timerLabel">Temps de jeu (secondes)</label>
            <div class="om-stepper">
              <button type="button" class="om-step" data-id="olemains-timer-less" data-step="-10" aria-label="Moins de temps" data-i18n-aria="timerLess">−</button>
              <input type="number" id="timer-input" class="om-timer-input" data-id="olemains-timer-input" value="60" min="10" max="300" step="10" inputmode="numeric">
              <button type="button" class="om-step" data-id="olemains-timer-more" data-step="10" aria-label="Plus de temps" data-i18n-aria="timerMore">+</button>
            </div>
          </div>
          <div class="om-field">
            <p class="om-label" id="olemains-deck-label" data-i18n="deckLabel">Choisis ton thème</p>
            <div id="deck-grid" class="om-decks" data-id="olemains-deck-list" role="group" aria-labelledby="olemains-deck-label"></div>
          </div>
        </div>
        <button id="olemains-start-button" class="om-button om-start" type="button" data-id="olemains-start-button" data-tv-focus data-i18n="newGame">Nouvelle partie</button>
        <p id="olemains-error" class="om-error" data-id="olemains-error" role="alert" hidden></p>
      </div>
    </section>

    <section id="game-view" class="om-screen om-play" data-id="olemains-play-screen" data-tv-screen hidden>
      <div class="om-hud" data-id="olemains-hud">
        <div class="om-stat">
          <span class="om-stat-label" data-i18n="timeLeft">Temps restant</span>
          <strong id="timer" class="om-stat-value" data-id="olemains-timer">60</strong>
        </div>
        <div class="om-stat">
          <span class="om-stat-label" data-i18n="score">Score</span>
          <strong id="score" class="om-stat-value" data-id="olemains-score">0</strong>
        </div>
      </div>
      <div class="om-card" id="card-background" data-id="olemains-word-card">
        <span id="current-word" data-id="olemains-word" aria-live="polite">Prêt ?</span>
      </div>
      <div class="om-controls">
        <button id="btn-pass" class="om-button om-fail" type="button" data-id="olemains-pass-button" data-i18n="pass">Passer</button>
        <button id="btn-valid" class="om-button om-success" type="button" data-id="olemains-found-button" data-tv-focus data-i18n="found">Trouvé</button>
      </div>

      <div class="om-overlay" data-id="olemains-pause-overlay" data-tv-overlay hidden>
        <div class="om-overlay-card" role="dialog" aria-modal="true" aria-labelledby="olemains-paused-title">
          <h2 id="olemains-paused-title" class="om-overlay-title" data-i18n="paused">En pause</h2>
          <button type="button" class="om-button om-start" data-id="olemains-continue-button" data-tv-focus data-tv-back data-i18n="continue">Continuer</button>
        </div>
      </div>
    </section>

    <section class="om-screen" data-id="olemains-gameover-screen" data-tv-screen hidden>
      <div class="om-dashboard om-end">
        <h2 class="om-title" data-id="olemains-final-reason"></h2>
        <p class="om-final-score" data-id="olemains-final-score"></p>
        <button type="button" class="om-button om-start" data-id="olemains-replay-button" data-tv-focus data-i18n="replay">Rejouer</button>
        <button type="button" class="om-button om-soft" data-id="olemains-menu-button" data-tv-back data-i18n="menu">Menu du jeu</button>
      </div>
    </section>
  </main>

  <script src="../../shared/js/game-header.js"></script>
  <script src="../../shared/js/game-session.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
