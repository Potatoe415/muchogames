<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Black Stories</title>
  <link rel="stylesheet" href="/shared/css/base.css" />
  <link rel="stylesheet" href="/shared/css/game-header.css" />
  <link rel="stylesheet" href="./blackstories.css" />
  <script src="/shared/js/tv-remote.js"></script>
</head>
<body data-match-saved>
  <header class="game-nav">
    <div class="nav-side nav-left">
      <!-- Game Dashboard: back to the hub. Hidden during a session. -->
      <a href="/" class="back-button" data-id="game-back-button" data-tv-back aria-label="Retour" data-i18n-aria="back"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></a>
      <!-- In a session: back to the Game Dashboard, after game-session.js asks. -->
      <button type="button" class="back-button" id="quitButton" data-id="blackstories-quit-button" data-match-quit data-tv-back aria-label="Quitter la partie" data-i18n-aria="quit" hidden><span aria-hidden="true">✕</span></button>
    </div>
    <div class="nav-center">
      <h1 id="nav-title" class="nav-title"></h1>
    </div>
    <div class="nav-side nav-right">
      <button id="settingsButton" class="options-button" type="button" data-id="game-options-button" aria-label="Options" data-i18n-aria="options" aria-expanded="false" aria-controls="settingsPanel">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </div>
  </header>

  <div id="settingsPanel" class="options-panel" data-id="game-options-panel" hidden>
    <div class="options-panel-backdrop" data-options-close></div>
    <div class="options-panel-sheet" role="dialog" aria-modal="true" aria-label="Options" data-i18n-aria="options">
      <div class="options-panel-header">
        <span class="options-panel-title" data-i18n="options">Options</span>
        <button type="button" class="options-panel-close" data-options-close data-id="blackstories-options-close" aria-label="Fermer" data-i18n-aria="close">×</button>
      </div>
      <div class="options-panel-body">
        <div class="options-panel-section" data-id="game-options-language">
          <p class="options-panel-section-title" data-i18n="language">Langue</p>
          <div class="langWrap" role="group" aria-label="Langue" data-i18n-aria="language">
            <button class="chip langBtn" data-lang="fr" data-id="blackstories-lang-fr" type="button">FR</button>
            <button class="chip langBtn" data-lang="en" data-id="blackstories-lang-en" type="button">EN</button>
            <button class="chip langBtn" data-lang="es" data-id="blackstories-lang-es" type="button">ES</button>
          </div>
        </div>
        <details id="rulesSection" class="options-panel-section" data-id="game-options-rules" style="display: none">
          <summary class="options-panel-section-title" data-i18n="rules">Règles</summary>
          <div id="rulesContent" class="rules-modal-content" data-id="blackstories-rules-content"></div>
        </details>
      </div>
    </div>
  </div>

  <section id="splashScreen" class="splash-screen" data-id="blackstories-dashboard-screen" data-tv-screen aria-label="Écran d’accueil" data-i18n-aria="dashboard">
    <div class="splashCard">
      <h1 class="splashTitle" data-id="blackstories-title">Black Stories</h1>
      <p class="splashSubtitle" data-i18n="subtitle">Lis l’énigme, réfléchis à l’histoire qui se cache derrière, puis touche la carte pour révéler la solution complète.</p>
      <div class="splashActions" data-id="blackstories-splash-actions">
        <button id="resumeButton" class="btn primary splashStart hidden" type="button" data-id="blackstories-resume-button" data-tv-focus data-i18n="resume">Reprendre</button>
        <button id="startButton" class="btn primary splashStart" type="button" data-id="blackstories-start-button" data-tv-focus data-i18n="start">Commencer</button>
      </div>
    </div>
  </section>

  <main id="gameContainer" class="container hidden" data-id="blackstories-play-screen" data-tv-screen>
    <section class="card" data-id="blackstories-story-card">
      <div class="metaRow">
        <div class="pill" id="storyCounter" data-id="blackstories-story-counter">—</div>
        <div class="pill" id="storyId" data-id="blackstories-story-id">ID: —</div>
      </div>

      <div class="titleRow">
        <h2 class="title" id="title" data-id="blackstories-story-title">Chargement…</h2>

        <div class="illusWrap" id="illusWrap" aria-hidden="true">
          <img id="illusImg" class="illusImg" alt="" data-id="blackstories-illustration" />
        </div>
      </div>

      <div class="label" data-i18n="shortLabel">Histoire courte</div>
      <p class="short" id="shortStory" data-id="blackstories-short-story">—</p>

      <button id="revealBox" class="revealBox" type="button" data-id="blackstories-reveal-button" data-tv-focus aria-label="Révéler l’histoire complète" data-i18n-aria="revealAria">
        <div class="revealHint" id="revealHint">Touchez pour révéler l’histoire complète</div>
        <div class="full hidden" id="fullStory" data-id="blackstories-full-story"></div>
      </button>
    </section>

    <div class="footerRow navRow" data-id="blackstories-nav">
      <button id="prevBtn" class="navBtn navPrev" type="button" data-id="blackstories-prev-button" aria-label="Précédent" data-i18n-aria="prev">
        <svg class="navIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <button id="nextBtn" class="navBtn navNext" type="button" data-id="blackstories-next-button" aria-label="Suivant" data-i18n-aria="next">
        <svg class="navIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </main>

  <script src="/shared/js/game-header.js"></script>
  <script src="/shared/js/game-session.js"></script>
  <script type="module" src="./blackstories.js"></script>
</body>
</html>
