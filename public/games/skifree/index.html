<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c0c0c0" />
    <title>SkiFree</title>
    <link rel="preload" href="assets/sprites.png" as="image" />
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a
          class="back-button"
          href="/"
          data-id="game-back-button"
          aria-label="Retour"
          data-i18n-aria="back"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-i18n="title">SkiFree</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          type="button"
          data-id="game-options-button"
          aria-label="Options"
          data-i18n-aria="options"
          aria-expanded="false"
          aria-controls="optionsPanel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="optionsPanel"
      class="options-panel"
      data-id="game-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div class="options-panel-sheet" role="dialog" aria-modal="true">
        <div class="options-panel-header">
          <span class="options-panel-title" data-i18n="options">Options</span>
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="skifree-options-close"
            aria-label="Fermer"
            data-i18n-aria="close"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section" data-id="game-options-language">
            <p class="options-panel-section-title" data-i18n="language">
              Langue
            </p>
            <div class="sf-lang-switch">
              <button
                type="button"
                class="sf-chip"
                data-lang="fr"
                data-id="skifree-lang-fr"
              >
                FR
              </button>
              <button
                type="button"
                class="sf-chip"
                data-lang="en"
                data-id="skifree-lang-en"
              >
                EN
              </button>
              <button
                type="button"
                class="sf-chip"
                data-lang="es"
                data-id="skifree-lang-es"
              >
                ES
              </button>
            </div>
          </div>
          <div class="options-panel-section" data-id="game-options-rules">
            <p class="options-panel-section-title" data-i18n="rules">Règles</p>
            <div
              class="rules-modal-content"
              data-id="skifree-rules-content"
            ></div>
          </div>
          <div class="options-panel-section" data-id="skifree-options-sound">
            <p class="options-panel-section-title" data-i18n="sound">Son</p>
            <button
              type="button"
              class="sf-chip"
              data-id="skifree-sound-toggle"
              aria-pressed="true"
            ></button>
          </div>
        </div>
      </div>
    </div>

    <main class="sf-app" data-id="skifree-app">
      <section class="sf-start" data-id="skifree-start-screen">
        <div class="sf-window" data-id="skifree-start-window">
          <div class="sf-titlebar" data-i18n="title">SkiFree</div>
          <div class="sf-window-body">
            <div
              class="sf-logo"
              role="img"
              aria-label="SkiFree"
              data-id="skifree-logo"
            ></div>
            <p class="sf-pitch" data-i18n="pitch"></p>
            <p class="sf-records-title" data-i18n="records">Records</p>
            <ul class="sf-records" data-id="skifree-start-records"></ul>
            <button
              type="button"
              class="sf-btn sf-btn-default"
              data-id="skifree-start-button"
              data-i18n="play"
            >
              Jouer
            </button>
          </div>
        </div>
      </section>

      <section class="sf-stage" data-id="skifree-stage" hidden>
        <div class="sf-board" data-id="skifree-board">
          <canvas
            class="sf-canvas"
            data-id="skifree-canvas"
            role="img"
            data-i18n-aria="canvas"
          ></canvas>
          <div class="sf-status" data-id="skifree-status-box">
            <div class="sf-status-row" data-id="skifree-status-time">
              <span data-i18n="timeLabel">Temps :</span>
              <span data-hud="time">0:00:00.00</span>
            </div>
            <div class="sf-status-row" data-id="skifree-status-dist">
              <span data-i18n="distLabel">Dist. :</span>
              <span data-hud="dist">0m</span>
            </div>
            <div class="sf-status-row" data-id="skifree-status-speed">
              <span data-i18n="speedLabel">Vitesse :</span>
              <span data-hud="speed">0m/s</span>
            </div>
            <div class="sf-status-row" data-id="skifree-status-style">
              <span data-i18n="styleLabel">Style :</span>
              <span data-hud="style">0</span>
            </div>
            <div
              class="sf-status-row sf-status-course"
              data-id="skifree-status-course"
              hidden
            >
              <span data-hud="course"></span>
            </div>
          </div>
          <div
            class="sf-window sf-toast"
            data-id="skifree-course-toast"
            role="status"
            hidden
          >
            <div class="sf-titlebar" data-i18n="title">SkiFree</div>
            <ul
              class="sf-window-body sf-toast-text"
              data-id="skifree-course-toast-text"
            ></ul>
          </div>
          <p
            class="sf-window sf-load-error"
            data-id="skifree-load-error"
            data-i18n="loadError"
            role="alert"
            hidden
          ></p>
        </div>

        <div class="sf-controls" data-id="skifree-controls">
          <button
            type="button"
            class="sf-btn sf-btn-jump"
            data-id="skifree-jump-button"
            data-i18n="jump"
          >
            Saut / Figure
          </button>
          <button
            type="button"
            class="sf-btn sf-btn-turbo"
            data-id="skifree-turbo-button"
            data-i18n="turbo"
            aria-pressed="false"
          >
            Turbo (F)
          </button>
          <button
            type="button"
            class="sf-btn"
            data-id="skifree-pause-button"
            data-i18n="pause"
          >
            Pause (P)
          </button>
          <button
            type="button"
            class="sf-btn"
            data-id="skifree-restart-button"
            data-i18n="restart"
          >
            Recommencer (R)
          </button>
        </div>

        <div class="sf-overlay" data-id="skifree-paused" hidden>
          <div class="sf-window sf-dialog">
            <div class="sf-titlebar" data-i18n="title">SkiFree</div>
            <div class="sf-window-body">
              <p class="sf-dialog-title" data-i18n="paused">Pause</p>
              <button
                type="button"
                class="sf-btn sf-btn-default"
                data-id="skifree-resume-button"
                data-i18n="resume"
              >
                Reprendre
              </button>
            </div>
          </div>
        </div>

        <div class="sf-overlay" data-id="skifree-game-over" hidden>
          <div class="sf-window sf-dialog">
            <div class="sf-titlebar" data-i18n="title">SkiFree</div>
            <div class="sf-window-body">
              <p class="sf-dialog-title" data-i18n="eatenTitle">Miam !</p>
              <p data-i18n="eatenText"></p>
              <p data-id="skifree-over-stats"></p>
              <p class="sf-best" data-id="skifree-over-best"></p>
              <button
                type="button"
                class="sf-btn sf-btn-default"
                data-id="skifree-replay-button"
                data-i18n="replay"
              >
                Rejouer
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
