<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d2230" />
    <title>Simon</title>
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/shared/css/game-header.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="start.css" />
    <link rel="stylesheet" href="stage.css" />
    <link rel="stylesheet" href="pads.css" />
    <script src="/shared/js/tv-remote.js"></script>
  </head>
  <body data-match-saved>
    <header class="game-nav">
      <div class="nav-side nav-left">
        <a
          class="back-button"
          href="/"
          data-id="game-back-button"
          data-tv-back
          aria-label="Retour"
          data-i18n-aria="back"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" /></svg
        ></a>
      </div>
      <div class="nav-center">
        <h1 class="nav-title" data-i18n="title">Simon</h1>
      </div>
      <div class="nav-side nav-right">
        <button
          class="options-button"
          type="button"
          data-id="game-options-button"
          aria-label="Options"
          data-i18n-aria="options"
          aria-expanded="false"
          aria-controls="optionsPanel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="optionsPanel"
      class="options-panel"
      data-id="game-options-panel"
      hidden
    >
      <div class="options-panel-backdrop" data-options-close></div>
      <div class="options-panel-sheet" role="dialog" aria-modal="true">
        <div class="options-panel-header">
          <span class="options-panel-title" data-i18n="options">Options</span>
          <button
            type="button"
            class="options-panel-close"
            data-options-close
            data-id="simon-options-close"
            aria-label="Fermer"
            data-i18n-aria="close"
          >
            ×
          </button>
        </div>
        <div class="options-panel-body">
          <div class="options-panel-section" data-id="game-options-language">
            <p class="options-panel-section-title" data-i18n="language">
              Langue
            </p>
            <div class="si-chips">
              <button
                type="button"
                class="si-chip"
                data-lang="fr"
                data-id="simon-lang-fr"
              >
                FR
              </button>
              <button
                type="button"
                class="si-chip"
                data-lang="en"
                data-id="simon-lang-en"
              >
                EN
              </button>
              <button
                type="button"
                class="si-chip"
                data-lang="es"
                data-id="simon-lang-es"
              >
                ES
              </button>
            </div>
          </div>
          <div class="options-panel-section" data-id="simon-options-sound">
            <p class="options-panel-section-title" data-i18n="sound">Son</p>
            <button
              type="button"
              class="si-chip"
              data-id="simon-sound-toggle"
              aria-pressed="true"
            ></button>
          </div>
          <details class="options-panel-section" data-id="game-options-rules">
            <summary class="options-panel-section-title" data-i18n="rules">
              Règles
            </summary>
            <div class="rules-modal-content" data-id="simon-rules-content"></div>
          </details>
        </div>
      </div>
    </div>

    <main class="si-app" data-id="simon-app">
      <section class="si-start" data-id="simon-start-screen" data-tv-screen>
        <div class="si-card">
          <p class="si-logo" aria-hidden="true">
            <span data-color="green"></span><span data-color="red"></span
            ><span data-color="yellow"></span><span data-color="blue"></span>
          </p>
          <h2 class="si-start-title" data-i18n="title">Simon</h2>
          <p class="si-pitch" data-i18n="pitch"></p>
          <div
            class="si-levels"
            data-id="simon-difficulty"
            role="group"
            data-i18n-aria="difficulty"
          >
            <button
              type="button"
              class="si-level"
              data-difficulty="easy"
              data-id="simon-difficulty-easy"
              data-i18n="easy"
            ></button>
            <button
              type="button"
              class="si-level"
              data-difficulty="normal"
              data-id="simon-difficulty-normal"
              data-i18n="normal"
            ></button>
          </div>
          <button
            type="button"
            class="si-button si-resume"
            data-id="simon-resume-button"
            data-tv-focus
            hidden
          >
            <span data-i18n="resume">Reprendre</span>
            <span class="si-resume-info" data-resume-info></span>
          </button>
          <button
            type="button"
            class="si-button"
            data-id="simon-play-button"
            data-tv-focus
            data-i18n="play"
          ></button>
          <p class="si-best" data-id="simon-start-best"></p>
        </div>
      </section>

      <section class="si-stage" data-id="simon-stage" data-tv-screen hidden>
        <div class="si-hud" data-id="simon-hud">
          <div class="si-stat" data-id="simon-score">
            <span class="si-stat-label" data-i18n="score">Tours</span>
            <span class="si-stat-value" data-id="simon-score-value">0</span>
          </div>
          <div class="si-stat" data-id="simon-best">
            <span class="si-stat-label" data-i18n="best">Record</span>
            <span class="si-stat-value" data-id="simon-best-value">0</span>
            <span class="si-stat-tag" data-id="simon-level-value"></span>
          </div>
          <p
            class="si-status"
            data-id="simon-status"
            role="status"
            aria-live="polite"
          ></p>
          <button
            type="button"
            class="si-tool"
            data-id="simon-menu-button"
            data-tv-back
            aria-label="Menu"
            data-i18n-aria="menuButton"
          >
            <span aria-hidden="true">☰</span>
          </button>
        </div>

        <div class="si-board-area" data-id="simon-board-area">
          <div
            class="si-board"
            data-id="simon-board"
            role="group"
            data-i18n-aria="board"
          >
            <button
              type="button"
              class="si-pad"
              data-pad="0"
              data-color="green"
              data-id="simon-pad-green"
              data-tv-focus
              data-i18n-aria="green"
            ></button>
            <button
              type="button"
              class="si-pad"
              data-pad="1"
              data-color="red"
              data-id="simon-pad-red"
              data-i18n-aria="red"
            ></button>
            <button
              type="button"
              class="si-pad"
              data-pad="2"
              data-color="yellow"
              data-id="simon-pad-yellow"
              data-i18n-aria="yellow"
            ></button>
            <button
              type="button"
              class="si-pad"
              data-pad="3"
              data-color="blue"
              data-id="simon-pad-blue"
              data-i18n-aria="blue"
            ></button>
            <span class="si-hub" aria-hidden="true" data-id="simon-hub-count"
              >0</span
            >
          </div>
        </div>
      </section>

      <div class="si-overlay" data-id="simon-paused" data-tv-overlay hidden>
        <div class="si-card" role="dialog" aria-modal="true">
          <h2 class="si-overlay-title" data-i18n="paused">Pause</h2>
          <p data-i18n="pausedText"></p>
          <button
            type="button"
            class="si-button"
            data-id="simon-continue-button"
            data-tv-focus
            data-tv-back
            data-i18n="continue"
          ></button>
          <button
            type="button"
            class="si-button si-button-soft"
            data-id="simon-paused-menu-button"
            data-match-quit
            data-i18n="menu"
          ></button>
        </div>
      </div>

      <div class="si-overlay" data-id="simon-end" data-tv-overlay hidden>
        <div class="si-card" role="dialog" aria-modal="true">
          <h2 class="si-overlay-title" data-i18n="endTitle"></h2>
          <p class="si-end-level" data-id="simon-end-level"></p>
          <p class="si-score-line" data-id="simon-end-score"></p>
          <p class="si-best" data-id="simon-end-best"></p>
          <button
            type="button"
            class="si-button"
            data-id="simon-replay-button"
            data-tv-focus
            data-i18n="replay"
          ></button>
          <button
            type="button"
            class="si-button si-button-soft"
            data-id="simon-end-menu-button"
            data-tv-back
            data-i18n="menu"
          ></button>
        </div>
      </div>
    </main>

    <script src="/shared/js/game-header.js"></script>
    <script src="/shared/js/game-session.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
