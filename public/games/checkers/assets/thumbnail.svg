  <use href="#piece-dark" x="260" y="210"/>
  <use href="#piece-light" x="140" y="250"/>
  <use href="#piece-light" x="60" y="330"/>
  <use href="#piece-light" x="220" y="330"/>
  <use href="#piece-light" x="300" y="330"/>
  <use href="#piece-light" x="100" y="370"/>
  <use href="#piece-light" x="180" y="370"/>
