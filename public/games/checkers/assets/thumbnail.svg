<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="90%">
      <stop offset="0" stop-color="#6a4229"/>
      <stop offset="1" stop-color="#1e130c"/>
    </radialGradient>
    <radialGradient id="light" cx="34%" cy="28%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f1e6d0"/>
      <stop offset="1" stop-color="#c4ad85"/>
    </radialGradient>
    <radialGradient id="dark" cx="34%" cy="28%" r="75%">
      <stop offset="0" stop-color="#76645a"/>
      <stop offset="0.5" stop-color="#2d221c"/>
      <stop offset="1" stop-color="#0e0907"/>
    </radialGradient>
    <pattern id="squares" x="40" y="110" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#f0d9b5"/>
      <rect x="40" width="40" height="40" fill="#a46b45"/>
      <rect y="40" width="40" height="40" fill="#a46b45"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.55"/>
    </filter>
    <g id="piece-light"><circle r="16" fill="url(#light)" filter="url(#shadow)"/><circle r="11" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="2"/></g>
    <g id="piece-dark"><circle r="16" fill="url(#dark)" filter="url(#shadow)"/><circle r="11" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="2"/></g>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect x="34" y="104" width="332" height="332" rx="14" fill="#5a3720" filter="url(#shadow)"/>
  <rect x="40" y="110" width="320" height="320" fill="url(#squares)"/>
  <use href="#piece-dark" x="100" y="130"/>
